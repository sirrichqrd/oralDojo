// --- DATA LAYER (dojo-data.js + catalog.json) — all content flows through DojoData ---
await DojoData.init();
let belts=[], questions={}, extraQs=[], research=[], leaderboard=[], dictionary=[], library=[], settings={};
let SENSEI_WHATSAPP='', SENSEI_EMAIL='';
function refreshData(){
  const c=DojoData.getCatalog();
  belts=c.belts||[]; questions={};
  (c.questions||[]).forEach(q=>{ (questions[q.belt]=questions[q.belt]||[]).push(q); });
  extraQs=c.extras||[]; research=c.research||[]; leaderboard=c.leaderboard||[];
  dictionary=c.dictionary||[]; library=c.library||[]; settings=c.settings||{};
  SENSEI_WHATSAPP=settings.senseiWhatsApp||'2348074001613';
  SENSEI_EMAIL=settings.senseiEmail||'oraldojo@ttosr.com';
}
refreshData();

// Self-healing render: if a corrupt catalog/draft ever breaks a view,
// discard the bad draft, reload the data and fall back to the welcome screen.
function render(){
  try{ renderApp(); }
  catch(e){
    console.error('Render failed — recovering from bad data:', e);
    DojoData.discardDraft().then(()=>{ refreshData(); state.view='welcome'; try{ renderApp(); }catch(e2){ document.getElementById('app').innerHTML='<div style="padding:48px 24px;text-align:center;font-family:sans-serif;font-weight:700">Dojo data error — please reload the page.</div>'; } });
  }
}

let toastTimer=null;
function showToast(msg){
  const oldT=document.getElementById('toast'); if(oldT) oldT.remove();
  const el=document.createElement('div');
  el.id='toast';
  el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] bg-black text-white text-[13px] font-bold px-5 py-3 rounded-full shadow-2xl border border-[#FFD93D]/30 flex items-center gap-2';
  el.innerHTML='<span style="color:#FFD93D">'+I.belt+'</span><span>'+msg+'</span>';
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),2800);
}

const FILLED={heart:1};
const ic=k=>'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="'+(FILLED[k]?'currentColor':'none')+'" stroke="currentColor" stroke-width="'+(FILLED[k]?1.5:2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ic">'+ICONS[k]+'</svg>';

// --- THESIS SUBMISSION (live) — batch queue + WhatsApp/Email share ---
const T_KEY='oralDojo_theses';
const tGet=()=>JSON.parse(localStorage.getItem(T_KEY)||'[]');
const tSet=l=>localStorage.setItem(T_KEY,JSON.stringify(l));
function buildThesisMsg(list){
  let msg='OSS! Oral Dojo — Thesis Submission ('+list.length+')\n';
  list.forEach((t,i)=>{
    msg+='\n['+(i+1)+'] '+t.title+'\n';
    msg+='By: '+(t.name||'Anonymous')+(t.grade?(' • '+t.grade):'')+(t.style?(' • '+t.style):'')+'\n';
    if(t.problem) msg+='Problem: '+t.problem+'\n';
    msg+='Methodology: '+t.method+'\n';
    msg+='Contribution: '+t.contribution+'\n';
    if(t.link) msg+='Link: '+t.link+'\n';
  });
  msg+='\n— Submitted from the Oral Dojo Research Hub (Godan+)';
  return msg;
}
const T_GRADES=['Godan (5th Dan)','Rokudan (6th Dan)','Rokudan (6th Dan)','Nanadan (7th Dan)','Hachidan (8th Dan)','Kudan (9th Dan)','Judan (10th Dan)','Other Senior Grade'];
function thesisModalHtml(saved){

    function wPaint(){
      slideEls.forEach((el,i)=>{

    }

        <div class="space-y-4">
          <div class="bg-white rounded-[24px] belt-shadow border border-black/5 p-5"><h3 class="fredoka font-bold">What 10th Dan means</h3><p class="text-[13px] leading-relaxed text-black/60 mt-2">Judan is not given for fighting. It's for a life that embodied Do. Teaching thousands, preserving kata, writing, building community. Our app ends at 10th but journey never ends.</p><div class="mt-4 flex items-center gap-2 text-[11px] font-bold"><span class="px-3 py-1.5 rounded-full bg-black text-white">Shu</span>→<span class="px-3 py-1.5 rounded-full bg-[#FAF8F5] border">Ha</span>→<span class="px-3 py-1.5 rounded-full bg-[#FFD93D] border border-black/10">Ri</span></div></div>
          <div class="bg-[#FFD93D] rounded-[24px] belt-shadow border border-black/10 p-5"><div class="fredoka font-bold text-[16px]">Submit your thesis</div><p class="text-[13px] font-medium mt-1 leading-relaxed">Are you Godan+? Share what you learned in your martial art journey. Methodology + contribution required.</p>${thesisSaved.length?`<button id="thesisReview" class="mt-4 w-full h-11 rounded-full bg-[#14B8A6] hover:bg-[#0F766E] text-white font-bold text-[13px] flex items-center justify-center gap-2 press shadow-[0_8px_20px_-6px_rgba(20,184,166,0.5)]"><span>Review &amp; Share ${thesisSaved.length} Pending Submission${thesisSaved.length===1?'':'s'}</span>→</button>`:''}<button id="openThesis" class="mt-4 w-full h-11 rounded-full bg-black text-white font-bold text-[13px] flex items-center justify-center gap-2 press"><span>Open Submission Form</span>→</button><p class="text-[11px] font-medium text-black/60 mt-2 text-center">Curated by senior grades • No McDojo content</p>${thesisSaved.length?`<p class="text-[11px] font-bold tracking-widest text-black/50 mt-2 text-center">${thesisSaved.length} SUBMISSION${thesisSaved.length===1?'':'S'} IN YOUR BATCH ON THIS DEVICE</p>`:''}</div>
          <div class="bg-white rounded-[24px] border border-black/5 p-5"><h4 class="fredoka font-bold text-[14px]">Sample oral questions for Godan</h4><ul class="mt-3 space-y-2 text-[13px] font-medium"><li class="flex gap-2"><span class="text-black/30">•</span> Explain your thesis methodology in 2 minutes</li><li class="flex gap-2"><span class="text-black/30">•</span> How does your research change how we teach Heian?</li><li class="flex gap-2"><span class="text-black/30">•</span> What is your contribution to karate-do beyond your dojo?</li><li class="flex gap-2"><span class="text-black/30">•</span> How do you handle a student who wants rank without time?</li></ul></div>
        </div>
      </div>
      ${state.thesisModal?thesisModalHtml(thesisSaved):''}
    </div>`;
    
    // auto scroll belt track to current
    const track=document.getElementById('beltTrack');
    const curCard=track?.querySelector('[data-belt-card="'+state.belt+'"]');
    if(track && curCard){
      const left = curCard.offsetLeft - track.clientWidth/2 + curCard.clientWidth/2;
      track.scrollTo({left:Math.max(0,left), behavior:'smooth'});
    }
    document.getElementById('backPath2').onclick=()=>transition('path');
    document.getElementById('closeResearch').onclick=()=>transition('path');
    // --- Thesis submission bindings ---
    document.getElementById('openThesis').onclick=()=>{state.thesisModal='form'; render();};
    document.getElementById('thesisReview')?.addEventListener('click',()=>{state.thesisModal='review'; render();});
    const tCloseAll=()=>{state.thesisModal=null; render();};
    document.querySelectorAll('.tCloseBtn').forEach(b=>b.addEventListener('click',tCloseAll));
    if(state.thesisModal&&state.thesisModal!=='form'){
      document.getElementById('tBackdrop')?.addEventListener('click',e=>{ if(e.target.id==='tBackdrop') tCloseAll(); });
    }
    if(state.thesisModal==='form'){
      document.getElementById('thesisForm').addEventListener('submit',e=>{
        e.preventDefault();
        const payload={
          name:document.getElementById('tName').value.trim(),
          grade:document.getElementById('tGrade').value,
          title:document.getElementById('tTitle').value.trim(),
          style:document.getElementById('tStyle').value.trim(),
          problem:document.getElementById('tProblem').value.trim(),
          method:document.getElementById('tMethod').value.trim(),
          contribution:document.getElementById('tContrib').value.trim(),
          link:document.getElementById('tLink').value.trim(),
          at:new Date().toISOString()
        };
        if(!payload.title||!payload.method||!payload.contribution){ showToast('Title, methodology and contribution are required'); return; }
        const list=tGet(); list.push(payload); tSet(list);
        state.thesisModal='done'; render(); showToast('Thesis added to batch — OSS!');
      });
    } else if(state.thesisModal==='done'||state.thesisModal==='review'){
      const shareTheses=how=>{
        const cur=tGet();
        if(!cur.length){ showToast('Your batch is empty'); return; }
        const msg=buildThesisMsg(cur);
        if(how==='wa'){ window.open('https://wa.me/'+SENSEI_WHATSAPP+'?text='+encodeURIComponent(msg),'_blank'); showToast('Theses sent to Sensei — OSS!'); }
        else { window.location.href='mailto:'+SENSEI_EMAIL+'?subject='+encodeURIComponent('Oral Dojo Thesis Submission ('+cur.length+')')+'&body='+encodeURIComponent(msg); showToast('Opening your email app — OSS!'); }
        tSet([]); state.thesisModal=null; render();
      };
      document.getElementById('tShareWa')?.addEventListener('click',()=>shareTheses('wa'));
      document.getElementById('tShareMail')?.addEventListener('click',()=>shareTheses('mail'));
      document.getElementById('tShareWa2')?.addEventListener('click',()=>shareTheses('wa'));
      document.getElementById('tShareMail2')?.addEventListener('click',()=>shareTheses('mail'));
      document.querySelectorAll('.tDel').forEach(btn=>btn.addEventListener('click',()=>{
        const idx=parseInt(btn.dataset.tdel,10); const cur=tGet(); cur.splice(idx,1); tSet(cur); render(); showToast('Removed from batch');
      }));
      document.getElementById('tAnother')?.addEventListener('click',()=>{state.thesisModal='form'; render();});
      document.getElementById('tAdd2')?.addEventListener('click',()=>{state.thesisModal='form'; render();});
    }
  }
}

render();
console.log("ORAL DOJO loaded. All " + belts.length + " belts unlocked. Data source: " + DojoData.getSource());
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      console.log('SW registered', reg.scope);
    }).catch(err=>console.log('SW failed', err));
  });
}
</script>
