<body class="min-h-screen w-full bg-[#FAF8F5] text-[#1A1A1A] relative overflow-x-clip selection:bg-[#FFD93D]/30">
<canvas id="three-canvas"></canvas>
<div id="app" class="relative z-10"></div>

<script src="dojo-data.js"></script>
<script type="module">
// --- DATA LAYER (dojo-data.js + catalog.json) — all content flows through DojoData ---
await DojoData.init();
let belts=[], questions={}, extraQs=[], research=[], leaderboard=[], dictionary=[], library=[], settings={};
let SENSEI_WHATSAPP='', SENSEI_EMAIL='';
function refreshData(){
  const c=DojoData.getCatalog();
  belts=c.belts||[]; questions={};
  (c.questions||[]).forEach(q=>{ (questions[q.belt]=questions[q.belt]||[]).push(q); });
  extraQs=c.extras||[]; research=c.research||[]; leaderboard=c.leaderboard||[];
  dictionary=c.dictionary||[]; library=c.library||[]; settings=c.settings||{};
  SENSEI_WHATSAPP=settings.senseiWhatsApp||'2348074001613';
  SENSEI_EMAIL=settings.senseiEmail||'oraldojo@ttosr.com';
}
refreshData();

// Self-healing render: if a corrupt catalog/draft ever breaks a view,
// discard the bad draft, reload the data and fall back to the welcome screen.
function render(){
  try{ renderApp(); }
  catch(e){
    console.error('Render failed — recovering from bad data:', e);
    DojoData.discardDraft().then(()=>{ refreshData(); state.view='welcome'; try{ renderApp(); }catch(e2){ document.getElementById('app').innerHTML='<div style="padding:48px 24px;text-align:center;font-family:sans-serif;font-weight:700">Dojo data error — please reload the page.</div>'; } });
  }
}

let toastTimer=null;
function showToast(msg){
  const oldT=document.getElementById('toast'); if(oldT) oldT.remove();
  const el=document.createElement('div');
  el.id='toast';
  el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] bg-black text-white text-[13px] font-bold px-5 py-3 rounded-full shadow-2xl border border-[#FFD93D]/30 flex items-center gap-2';
  el.innerHTML='<span>🥋</span><span>'+msg+'</span>';
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),2800);
}

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// --- THESIS SUBMISSION (live) — batch queue + WhatsApp/Email share ---
const T_KEY='oralDojo_theses';
const tGet=()=>JSON.parse(localStorage.getItem(T_KEY)||'[]');
const tSet=l=>localStorage.setItem(T_KEY,JSON.stringify(l));
function buildThesisMsg(list){
  let msg='OSS! Oral Dojo — Thesis Submission ('+list.length+')\n';
  list.forEach((t,i)=>{
    msg+='\n['+(i+1)+'] '+t.title+'\n';
    msg+='By: '+(t.name||'Anonymous')+(t.grade?(' • '+t.grade):'')+(t.style?(' • '+t.style):'')+'\n';
    if(t.problem) msg+='Problem: '+t.problem+'\n';
    msg+='Methodology: '+t.method+'\n';
    msg+='Contribution: '+t.contribution+'\n';
    if(t.link) msg+='Link: '+t.link+'\n';
  });
  msg+='\n— Submitted from the Oral Dojo Research Hub (Yondan+)';
  return msg;
}
const T_GRADES=['Yondan (4th Dan)','Godan (5th Dan)','Rokudan (6th Dan)','Nanadan (7th Dan)','Hachidan (8th Dan)','Kudan (9th Dan)','Judan (10th Dan)','Other Senior Grade'];
function thesisModalHtml(saved){

  if(mode==='form'){
    return shell(`

          <div><label class="text-[11px] font-black tracking-widest text-black/50">GRADE</label><select id="tGrade" class="mt-1 w-full h-11 rounded-2xl border-2 border-black/10 bg-[#FAF8F5] px-3 font-semibold text-[14px] focus:border-black outline-none">${T_GRADES.map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div>

        <div><label class="text-[11px] font-black tracking-widest text-black/50">CONTRIBUTION * (WHAT CAN OTHERS USE?)</label><textarea id="tContrib" rows="3" placeholder="Drills, curriculum, business model that others can copy..." class="mt-1 w-full rounded-2xl border-2 border-black/10 px-3 py-2 font-semibold text-[14px] focus:border-black outline-none"></textarea></div>
        <div><label class="text-[11px] font-black tracking-widest text-black/50">LINK (OPTIONAL)</label><input id="tLink" placeholder="https://..." class="mt-1 w-full h-11 rounded-2xl border-2 border-black/10 px-3 font-semibold text-[14px] focus:border-black outline-none"></div>
        <button type="submit" class="w-full h-[50px] rounded-full bg-black text-white font-bold fredoka text-[15px] press flex items-center justify-center gap-2">Add to Batch →</button>
        <p class="text-[11px] font-medium text-black/40 text-center">Saved to your batch on this device • Share everything with Sensei at once when ready</p>
      </form>`);
  }
  if(mode==='review'){
    return shell(`
      <div class="flex items-center justify-between flex-wrap gap-2"><h2 class="fredoka text-[22px] font-bold">Pending Theses</h2><div class="flex items-center gap-2"><span class="text-[10px] font-black tracking-widest px-2.5 py-1 rounded-full bg-black text-white">${saved.length} SAVED</span><button class="tCloseBtn w-8 h-8 rounded-full bg-[#FAF8F5] border flex items-center justify-center press">✕</button></div></div>
      <div class="mt-4 space-y-3">
        ${saved.length?saved.map((t,i)=>`<div class="rounded-2xl border-2 border-black/5 bg-[#FAF8F5] p-4">
          <div class="flex items-center gap-2"><span class="text-[10px] font-black tracking-widest px-2 py-0.5 rounded-full bg-white border">${esc(t.grade||'Yondan+')}</span><span class="text-[10px] font-bold text-black/40">#${i+1}</span><button data-tdel="${i}" class="tDel ml-auto w-7 h-7 rounded-full bg-white border flex items-center justify-center text-[12px] press" title="Remove from batch">✕</button></div>
          <div class="font-bold text-[14px] mt-2 leading-snug">${esc(t.title)}</div>
          <div class="text-[12px] text-black/50 mt-1 leading-snug"><b class="text-black/70">Method:</b> ${esc(t.method)}</div>
          <div class="text-[12px] text-black/50 mt-1 leading-snug"><b class="text-black/70">Contribution:</b> ${esc(t.contribution)}</div>
        </div>`).join(''):`<div class="rounded-2xl border-2 border-dashed border-black/10 p-6 text-center text-[13px] font-semibold text-black/50">Your batch is empty — add a thesis first.</div>`}
      </div>
      ${saved.length?`<div class="mt-5 space-y-2">
        <button id="tShareWa2" class="w-full h-[52px] rounded-full bg-[#25D366] hover:bg-[#1DA851] text-white font-bold fredoka text-[15px] press flex items-center justify-center gap-2 shadow-[0_8px_20px_-6px_rgba(37,211,102,0.5)]">Share ${saved.length} Thesis${saved.length===1?'':'es'} via WhatsApp →</button>
        <button id="tShareMail2" class="w-full h-[52px] rounded-full bg-black text-white font-bold fredoka text-[15px] press flex items-center justify-center gap-2">Share via Email →</button>
        <p class="text-[11px] font-bold tracking-widest text-black/30 text-center">SENSEI RICHQRD • 0807 400 1613</p>
      </div>`:''}
      <div class="mt-3 grid grid-cols-2 gap-2">
        <button id="tAdd2" class="h-11 rounded-full bg-[#FAF8F5] border font-bold text-[13px] press">+ Add Another</button>
        <button class="tCloseBtn h-11 rounded-full bg-[#FAF8F5] border font-bold text-[13px] press">Close</button>
      </div>`);
  }
  return shell(`
    <div class="text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-[#E8FFF3] border border-[#2ECC71]/30 flex items-center justify-center text-[30px]">🎉</div>
      <h2 class="fredoka text-[24px] font-bold mt-4">Thesis saved — OSS!</h2>
      <p class="text-[13px] font-medium text-black/60 mt-2 leading-relaxed">Your batch now holds <span class="font-bold text-black">${saved.length} submission${saved.length===1?'':'s'}</span>. Keep adding more, or share them all with Sensei at once.</p>
      <div class="mt-5 space-y-2">
        <button id="tShareWa" class="w-full h-12 rounded-full bg-[#25D366] text-white font-bold fredoka text-[14px] press">Share ${saved.length} Submission${saved.length===1?'':'s'} with Sensei →</button>
        <div class="grid grid-cols-2 gap-2">
          <button id="tAnother" class="h-12 rounded-full bg-black text-white font-bold fredoka text-[14px] press">Add Another</button>
          <button class="tCloseBtn h-12 rounded-full bg-[#FAF8F5] border font-bold fredoka text-[14px] press">Close</button>
        </div>
      </div>
    </div>`);
}

// --- APP STATE ---
let state={
 view:'welcome',
 belt:0,
 unlocked:[0],
 completed:[],
 lastCompleted:null,
 contribStep:'gate',
 xp:1240,
 gems:340,
 streak:7,
 hearts:3,
 qIndex:0,
 selected:null,
 answered:false,
 correct:null,
 xpEarned:0,
 menu:false,
 wobble:false,
 outOfHearts:false,
 thesisModal:null,
};

const app=document.getElementById('app');

function transition(to){
  if(to==='contribute') state.contribStep='gate';
  state.view=to;
  render();
  if(to==='path'){
    // Auto-scroll to the belt just completed so the user can tap onward to the next belt
    const target=(state.lastCompleted!==null)?state.lastCompleted:state.belt;
    setTimeout(()=>{
      const card=document.querySelector('[data-belt-card="'+target+'"]');
      if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
      else window.scrollTo({top:0, behavior:'smooth'});
    },250);
  } else {
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function getLesson(){
  const list = questions[state.belt] || [...(questions[0]||[]), ...extraQs].slice(0,5);
  return list;
}

function renderApp(){
  const belt = belts.find(b=>b.id===state.belt) || belts[0];
  const lesson = getLesson();
  const q = lesson[state.qIndex];
  const progress = lesson.length ? (state.qIndex/lesson.length*100) : 0;

  if(state.view==='welcome'){
    app.innerHTML=`
    <div class="min-h-screen w-full flex flex-col">

            <div class="mt-7 space-y-2.5 max-w-[480px] mx-auto lg:mx-0 text-left">
              <div class="flex items-center gap-3 bg-white rounded-2xl px-4 py-3 border border-black/[0.06] shadow-sm"><div class="w-9 h-9 rounded-full bg-[#FAF8F5] flex items-center justify-center shrink-0">⚡</div><span class="text-[13px] sm:text-[14px] font-semibold">5-min oral lessons</span></div>
              <div class="flex items-center gap-3 bg-white rounded-2xl px-4 py-3 border border-black/[0.06] shadow-sm"><div class="w-9 h-9 rounded-full bg-[#FAF8F5] flex items-center justify-center shrink-0">🎯</div><span class="text-[13px] sm:text-[14px] font-semibold">Earn XP, keep streak, unlock belts</span></div>
              <div class="flex items-center gap-3 bg-white rounded-2xl px-4 py-3 border border-black/[0.06] shadow-sm"><div class="w-9 h-9 rounded-full bg-[#FAF8F5] flex items-center justify-center shrink-0">📚</div><span class="text-[13px] sm:text-[14px] font-semibold">4th Dan+ research hub</span></div>
            </div>
            <div class="mt-8 max-w-[480px] mx-auto lg:mx-0">

              <p class="text-center lg:text-left text-[12px] mt-3 text-[#9A9A96] font-medium">No email needed • Instant dojo • OSS!</p>

              <div class="glass rounded-full px-3.5 py-2 text-[11px] font-bold">⭐ 4.9/5 oral prep</div>

                    </div>

                    <div class="absolute -left-2 bottom-6 w-10 h-10 bg-black rounded-full flex items-center justify-center text-white font-bold shadow-lg -rotate-12 float" style="animation-delay:.6s">初</div>
                    <div class="absolute right-8 -bottom-2 px-3 py-1 bg-white rounded-full shadow-md border flex items-center gap-1 text-[11px] font-bold">⭐ Oral Grading</div>
                  </div>
                </div>
                <div class="text-center mt-4">
                  <h2 class="fredoka text-[20px] sm:text-[22px] font-bold tracking-tight">White to Judan — one path.</h2>
                  <p class="text-[13px] text-[#6B6B68] font-medium mt-1"> Oral grading for every kyu and dan.</p>
                </div>
                <div class="mt-5 grid grid-cols-3 gap-2">
                  <div class="bg-white rounded-2xl p-3 border border-black/5 text-center"><div class="text-[20px]">🏯</div><div class="text-[11px] font-bold mt-1 tracking-wide">History</div></div>
                  <div class="bg-white rounded-2xl p-3 border border-black/5 text-center"><div class="text-[20px]">🥊</div><div class="text-[11px] font-bold mt-1 tracking-wide">Technique</div></div>
                  <div class="bg-white rounded-2xl p-3 border border-black/5 text-center"><div class="text-[20px]">📜</div><div class="text-[11px] font-bold mt-1 tracking-wide">Philosophy</div></div>
                </div>
                <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <button id="wDictionary" class="h-11 rounded-full bg-white border border-black/10 text-[12px] font-bold press flex items-center justify-center gap-1.5">🔤 Dictionary</button>
                  <button id="wLibrary" class="h-11 rounded-full bg-white border border-black/10 text-[12px] font-bold press flex items-center justify-center gap-1.5">🗂️ Library</button>
                  <button id="wContribute" class="h-11 rounded-full bg-white border border-black/10 text-[12px] font-bold press flex items-center justify-center gap-1.5">🤝 Contribute</button>
                  <button id="wFeedback" class="h-11 rounded-full bg-white border border-black/10 text-[12px] font-bold press flex items-center justify-center gap-1.5">💬 Feedback</button>
                </div>
              </div>
            </div>
            <p class="text-center text-[10px] mt-5 tracking-widest font-bold text-black/30">Oral Grading • History • Techniques • Philosophy • Tradition • Research</p>
          </div>
        </div>
      </div>
    </div>`;
    document.getElementById('startBtn').onclick=()=>transition('path');
    document.getElementById('wDictionary')?.addEventListener('click',()=>transition('dictionary'));
    document.getElementById('wLibrary')?.addEventListener('click',()=>transition('library'));
    document.getElementById('wContribute')?.addEventListener('click',()=>transition('contribute'));
    document.getElementById('wFeedback')?.addEventListener('click',()=>transition('feedback'));
  } else if(state.view==='path'){
    app.innerHTML=`

    document.getElementById('dictBack').onclick=()=>transition('path');

    const applyDictFilter=()=>{
      const q=(document.getElementById('dictSearch').value||'').trim().toLowerCase();
      let visible=0;
      document.querySelectorAll('.dictItem').forEach(el=>{
        const hit=(activeCat==='All'||el.dataset.category===activeCat)&&(!q||el.dataset.search.indexOf(q)>=0);

      });
      document.getElementById('dictEmpty').classList.toggle('hidden',visible>0);
      document.querySelectorAll('.dictCat').forEach(b=>{
        const on=b.dataset.cat===activeCat;
        b.className='dictCat text-[11px] font-bold px-3 py-1.5 rounded-full border '+(on?'bg-black text-white border-black':'bg-white border-black/10');
      });
    };
    document.getElementById('dictSearch').addEventListener('input',applyDictFilter);
    document.querySelectorAll('.dictCat').forEach(b=>b.addEventListener('click',()=>{activeCat=b.dataset.cat;applyDictFilter();}));
  } else if(state.view==='library'){
    const libTypes=['All','Book','Reference','Article','Video','Link'];
    app.innerHTML=`
    <div class="min-h-screen">
      <header class="sticky top-0 z-30 glass-dark border-b border-black/[0.06]">
        <div class="max-w-[980px] mx-auto px-4 h-[64px] flex items-center justify-between">
          <button id="libBack" class="flex items-center gap-2 font-bold"><div class="w-8 h-8 rounded-full bg-[#FAF8F5] border flex items-center justify-center">←</div><span class="fredoka">Library</span></button>
          <div class="flex items-center gap-2"><span class="text-[11px] font-black tracking-widest bg-black text-white px-3 py-1.5 rounded-full">${library.length} RESOURCES</span></div>
        </div>
      </header>
      <div class="max-w-[980px] mx-auto px-4 py-6">
        <div class="bg-black text-white rounded-[28px] p-6 sm:p-8 relative overflow-hidden belt-shadow">
          <div class="absolute -right-16 -top-16 w-56 h-56 bg-[#FFD93D] rounded-full blur-[60px] opacity-20"></div>
          <div class="relative"><div class="inline-flex items-center gap-2 bg-white/10 border border-white/10 rounded-full px-3 py-1 text-[11px] font-bold tracking-widest">🗂️ DOJO LIBRARY</div><h1 class="fredoka text-[28px] sm:text-[34px] font-bold leading-[0.95] mt-4">Read what the<br>masters wrote.</h1><p class="text-[14px] text-white/70 mt-3 max-w-[520px]">Books, references, articles and videos for every step of the path — from Funakoshi's autobiography to the WKF rulebook.</p></div>
        </div>
        <div class="mt-5 flex flex-wrap gap-2">${libTypes.map(t=>`<button data-type="${t}" class="libType text-[11px] font-bold px-3 py-1.5 rounded-full border ${t==='All'?'bg-black text-white border-black':'bg-white border-black/10'}">${t}</button>`).join('')}</div>
        <div class="mt-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          ${library.map(l=>`<div class="libItem bg-white rounded-[24px] belt-shadow border border-black/5 p-5 flex flex-col" data-type="${esc(l.type)}">
            <div class="flex items-center justify-between"><span class="text-[10px] font-black tracking-widest px-2.5 py-1 rounded-full bg-[#FFF8D6] border border-[#FFD93D]/40">${esc(l.type)}</span><span class="text-[10px] font-bold px-2 py-1 rounded-full bg-[#FAF8F5] border">${esc(l.category)}</span></div>

            <div class="text-[12px] font-semibold text-black/50 mt-1">${esc(l.author||'')}</div>
            <p class="text-[13px] font-medium text-black/60 leading-relaxed mt-2 flex-1">${esc(l.description)}</p>
            ${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener" class="mt-3 inline-flex items-center gap-1 text-[12px] font-bold text-[#0F766E]">Open resource ↗</a>`:''}
          </div>`).join('')}
        </div>
        <div id="libEmpty" class="hidden mt-5 bg-white rounded-[22px] border-2 border-dashed border-black/10 p-8 text-center fredoka font-bold text-black/40">Nothing in this category yet.</div>
        <div class="mt-6 text-center text-[11px] font-bold tracking-widest text-black/30">GROW THE LIBRARY • SUGGEST RESOURCES VIA FEEDBACK</div>
      </div>
    </div>`;
    document.getElementById('libBack').onclick=()=>transition('path');
    let activeType='All';
    const applyLibFilter=()=>{
      let visible=0;
      document.querySelectorAll('.libItem').forEach(el=>{
        const hit=activeType==='All'||el.dataset.type===activeType;
        el.style.display=hit?'':'none'; if(hit)visible++;
      });
      document.getElementById('libEmpty').classList.toggle('hidden',visible>0);
      document.querySelectorAll('.libType').forEach(b=>{
        const on=b.dataset.type===activeType;
        b.className='libType text-[11px] font-bold px-3 py-1.5 rounded-full border '+(on?'bg-black text-white border-black':'bg-white border-black/10');
      });
    };
    document.querySelectorAll('.libType').forEach(b=>b.addEventListener('click',()=>{activeType=b.dataset.type;applyLibFilter();}));

  } else if(state.view==='research'){
    const thesisSaved=tGet();
    app.innerHTML=`
    <div class="min-h-screen">
      <header class="sticky top-0 z-30 glass-dark border-b border-black/5">
        <div class="max-w-[980px] mx-auto px-4 h-[64px] flex items-center justify-between">
          <button id="backPath2" class="flex items-center gap-2 font-bold"><div class="w-8 h-8 rounded-full bg-[#FAF8F5] border flex items-center justify-center">←</div><span class="fredoka">Research Hub</span></button>
          <div class="flex items-center gap-2"><span class="hidden sm:flex text-[11px] font-bold tracking-widest bg-black text-white px-3 py-1.5 rounded-full">YONDAN+ • 4TH DAN AND ABOVE</span><button id="closeResearch" class="w-8 h-8 rounded-full bg-white border flex items-center justify-center">✕</button></div>
        </div>
      </header>
      <div class="max-w-[980px] mx-auto px-4 py-6 grid lg:grid-cols-[1.2fr_0.8fr] gap-6">
        <div>
          <div class="bg-black text-white rounded-[28px] p-6 sm:p-8 relative overflow-hidden belt-shadow"><div class="absolute -right-20 -top-20 w-[300px] h-[300px] bg-[#FFD93D] rounded-full blur-[60px] opacity-20"></div><div class="relative"><div class="inline-flex items-center gap-2 bg-white/10 border border-white/10 rounded-full px-3 py-1 text-[11px] font-bold tracking-widest">📚 4TH DAN RESEARCH HUB</div><h1 class="fredoka text-[28px] sm:text-[36px] font-bold leading-[0.95] mt-4">Theses from the<br>martial journey.</h1><p class="text-[14px] leading-relaxed text-white/70 mt-3 max-w-[520px]">From 4th Dan, Karate-Do asks: what have you contributed? Here, Yondan to Judan share original research, methodology, business lessons, and personal testimonies. This is where karate becomes scholarship.</p><div class="mt-6 flex flex-wrap gap-2">${["Original Research","Methodology","Contribution","Bunkai","Business","Philosophy"].map(k=>`<span class="text-[11px] font-bold px-3 py-1.5 rounded-full bg-white text-black">${k}</span>`).join('')}</div></div></div>
          <div class="mt-6 grid sm:grid-cols-2 gap-4">${research.map(r=>`
            <div class="bg-white rounded-[24px] belt-shadow border border-black/5 p-5 flex flex-col"><div class="flex items-center justify-between"><span class="text-[10px] font-black tracking-widest px-2.5 py-1 rounded-full bg-[#FAF8F5] border">${r.tag}</span><span class="text-[11px] font-bold text-black/40 flex items-center gap-1">❤️ ${r.likes}</span></div><h3 class="fredoka font-bold text-[16px] leading-tight mt-3">${r.title}</h3><p class="text-[13px] leading-relaxed text-black/60 mt-2 flex-1">${r.excerpt}</p><div class="mt-4 flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center text-[11px] font-bold">${r.rank[0]}</div><div><div class="text-[12px] font-bold leading-none">${r.author}</div><div class="text-[11px] text-black/50 font-semibold">${r.rank} • 12 min read</div></div><button class="ml-auto w-8 h-8 rounded-full bg-[#FAF8F5] border flex items-center justify-center">↗</button></div></div>
          `).join('')}</div>
          <div class="mt-6 bg-white rounded-[24px] border-2 border-dashed border-black/10 p-6"><h3 class="fredoka font-bold text-[18px]">How to write a Yondan thesis?</h3><div class="mt-4 grid sm:grid-cols-2 gap-3 text-[13px] font-medium">${[{n:"1",t:"Question: What problem in karate are you solving?",d:"e.g., Why beginners quit after 3 months"},{n:"2",t:"Literature: What did old masters say?",d:"Reference Funakoshi, Mabuni, primary sources"},{n:"3",t:"Method: How did you test?",d:"Data from your dojo, HRV, interviews, video analysis"},{n:"4",t:"Contribution: What can others use?",d:"Drills, curriculum, business model that others can copy"}].map(k=>`<div class="bg-[#FAF8F5] rounded-2xl p-4 border border-black/5"><div class="flex items-center gap-2 font-black"><span class="w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[12px]">${k.n}</span>${k.t}</div><div class="text-black/60 mt-1 text-[12px]">${k.d}</div></div>`).join('')}</div></div>
        </div>
        <div class="space-y-4">
          <div class="bg-white rounded-[24px] belt-shadow border border-black/5 p-5"><h3 class="fredoka font-bold">What 10th Dan means</h3><p class="text-[13px] leading-relaxed text-black/60 mt-2">Judan is not given for fighting. It's for a life that embodied Do. Teaching thousands, preserving kata, writing, building community. Our app ends at 10th but journey never ends.</p><div class="mt-4 flex items-center gap-2 text-[11px] font-bold"><span class="px-3 py-1.5 rounded-full bg-black text-white">Shu</span>→<span class="px-3 py-1.5 rounded-full bg-[#FAF8F5] border">Ha</span>→<span class="px-3 py-1.5 rounded-full bg-[#FFD93D] border border-black/10">Ri</span></div></div>
          <div class="bg-[#FFD93D] rounded-[24px] belt-shadow border border-black/10 p-5"><div class="fredoka font-bold text-[16px]">Submit your thesis</div><p class="text-[13px] font-medium mt-1 leading-relaxed">Are you Yondan+? Share what you learned in your martial art journey. Methodology + contribution required.</p>${thesisSaved.length?`<button id="thesisReview" class="mt-4 w-full h-11 rounded-full bg-[#14B8A6] hover:bg-[#0F766E] text-white font-bold text-[13px] flex items-center justify-center gap-2 press shadow-[0_8px_20px_-6px_rgba(20,184,166,0.5)]"><span>Review &amp; Share ${thesisSaved.length} Pending Submission${thesisSaved.length===1?'':'s'}</span>→</button>`:''}<button id="openThesis" class="mt-4 w-full h-11 rounded-full bg-black text-white font-bold text-[13px] flex items-center justify-center gap-2 press"><span>Open Submission Form</span>→</button><p class="text-[11px] font-medium text-black/60 mt-2 text-center">Curated by senior grades • No McDojo content</p>${thesisSaved.length?`<p class="text-[11px] font-bold tracking-widest text-black/50 mt-2 text-center">${thesisSaved.length} SUBMISSION${thesisSaved.length===1?'':'S'} IN YOUR BATCH ON THIS DEVICE</p>`:''}</div>
          <div class="bg-white rounded-[24px] border border-black/5 p-5"><h4 class="fredoka font-bold text-[14px]">Sample oral questions for Yondan</h4><ul class="mt-3 space-y-2 text-[13px] font-medium"><li class="flex gap-2"><span class="text-black/30">•</span> Explain your thesis methodology in 2 minutes</li><li class="flex gap-2"><span class="text-black/30">•</span> How does your research change how we teach Heian?</li><li class="flex gap-2"><span class="text-black/30">•</span> What is your contribution to karate-do beyond your dojo?</li><li class="flex gap-2"><span class="text-black/30">•</span> How do you handle a student who wants rank without time?</li></ul></div>
        </div>
      </div>
      ${state.thesisModal?thesisModalHtml(thesisSaved):''}
    </div>`;
    document.getElementById('backPath2').onclick=()=>transition('path');
    document.getElementById('closeResearch').onclick=()=>transition('path');
    // --- Thesis submission bindings ---
    document.getElementById('openThesis').onclick=()=>{state.thesisModal='form'; render();};
    document.getElementById('thesisReview')?.addEventListener('click',()=>{state.thesisModal='review'; render();});
    const tCloseAll=()=>{state.thesisModal=null; render();};
    document.querySelectorAll('.tCloseBtn').forEach(b=>b.addEventListener('click',tCloseAll));
    if(state.thesisModal&&state.thesisModal!=='form'){
      document.getElementById('tBackdrop')?.addEventListener('click',e=>{ if(e.target.id==='tBackdrop') tCloseAll(); });
    }
    if(state.thesisModal==='form'){
      document.getElementById('thesisForm').addEventListener('submit',e=>{
        e.preventDefault();
        const payload={
          name:document.getElementById('tName').value.trim(),
          grade:document.getElementById('tGrade').value,
          title:document.getElementById('tTitle').value.trim(),
          style:document.getElementById('tStyle').value.trim(),
          problem:document.getElementById('tProblem').value.trim(),
          method:document.getElementById('tMethod').value.trim(),
          contribution:document.getElementById('tContrib').value.trim(),
          link:document.getElementById('tLink').value.trim(),
          at:new Date().toISOString()
        };
        if(!payload.title||!payload.method||!payload.contribution){ showToast('Title, methodology and contribution are required'); return; }
        const list=tGet(); list.push(payload); tSet(list);
        state.thesisModal='done'; render(); showToast('Thesis added to batch — OSS!');
      });
    } else if(state.thesisModal==='done'||state.thesisModal==='review'){
      const shareTheses=how=>{
        const cur=tGet();
        if(!cur.length){ showToast('Your batch is empty'); return; }
        const msg=buildThesisMsg(cur);
        if(how==='wa'){ window.open('https://wa.me/'+SENSEI_WHATSAPP+'?text='+encodeURIComponent(msg),'_blank'); showToast('Theses sent to Sensei — OSS!'); }
        else { window.location.href='mailto:'+SENSEI_EMAIL+'?subject='+encodeURIComponent('Oral Dojo Thesis Submission ('+cur.length+')')+'&body='+encodeURIComponent(msg); showToast('Opening your email app — OSS!'); }
        tSet([]); state.thesisModal=null; render();
      };
      document.getElementById('tShareWa')?.addEventListener('click',()=>shareTheses('wa'));
      document.getElementById('tShareMail')?.addEventListener('click',()=>shareTheses('mail'));
      document.getElementById('tShareWa2')?.addEventListener('click',()=>shareTheses('wa'));
      document.getElementById('tShareMail2')?.addEventListener('click',()=>shareTheses('mail'));
      document.querySelectorAll('.tDel').forEach(btn=>btn.addEventListener('click',()=>{
        const idx=parseInt(btn.dataset.tdel,10); const cur=tGet(); cur.splice(idx,1); tSet(cur); render(); showToast('Removed from batch');
      }));
      document.getElementById('tAnother')?.addEventListener('click',()=>{state.thesisModal='form'; render();});
      document.getElementById('tAdd2')?.addEventListener('click',()=>{state.thesisModal='form'; render();});
    }
  }
}

render();
console.log("ORAL DOJO loaded. All " + belts.length + " belts unlocked. Data source: " + DojoData.getSource());
</script>
