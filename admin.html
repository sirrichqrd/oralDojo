<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORAL DOJO — Admin Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#FAF8F5; --card:#FFFFFF; --ink:#1A1A1A; --muted:#8A8A86; --teal:#14B8A6; --teal-dark:#0F766E; --yellow:#FFD93D; --orange:#FF8C42; }
*{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
h1,h2,h3,.fredoka{font-family:"Fredoka",sans-serif}
.glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(255,255,255,0.78);border:1px solid rgba(255,255,255,0.6)}
.belt-shadow{box-shadow:0 12px 24px -6px rgba(0,0,0,0.12),0 4px 12px -2px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.8)}
.press:active{transform:scale(0.97)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#toast{animation:toastIn .28s ease}
.check{width:20px;height:20px}

</head>
<body class="min-h-screen w-full bg-[#FAF8F5] text-[#1A1A1A] selection:bg-[#FFD93D]/30">
<div id="app" class="relative z-10"></div>

<script src="dojo-data.js"></script>
<script type="module">
await DojoData.init();

let belts=[], questions={}, research=[], dictionary=[], library=[], settings={};
function refreshData(){
  const c=DojoData.getCatalog();
  belts=c.belts||[]; questions={};
  (c.questions||[]).forEach(q=>{ (questions[q.belt]=questions[q.belt]||[]).push(q); });
  research=c.research||[]; dictionary=c.dictionary||[]; library=c.library||[]; settings=c.settings||{};
}
refreshData();

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let toastTimer=null;
function showToast(msg){
  const oldT=document.getElementById('toast'); if(oldT) oldT.remove();
  const el=document.createElement('div');
  el.id='toast';
  el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] bg-black text-white text-[13px] font-bold px-5 py-3 rounded-full shadow-2xl border border-[#FFD93D]/30 flex items-center gap-2';
  el.innerHTML='<span>⚙️</span><span>'+msg+'</span>';
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),3200);
}

const arm=(btn,fn)=>{
  if(btn.dataset.armed==='1'){ fn(); return; }
  btn.dataset.armed='1'; const old=btn.innerHTML; btn.innerHTML='Sure?';
  setTimeout(()=>{ if(btn.isConnected){btn.innerHTML=old; btn.dataset.armed='';} },2600);
};

const app=document.getElementById('app');
let state={
  authed: sessionStorage.getItem('oralDojo_admin_auth')==='1',
  tab:'questions',
  form:null,
  qBelt:'all',
  selected:new Set(),
  bulkOpen:false,
  bulkText:`Belt: 1
Topic: Concepts
Type: mcq
Q: What does Dojo mean?
A) Place of the way
B) Fighting arena
C) Meditation hall
D) Weapon store
Answer: A
Explanation: Dojo translates to place of the way.

---
Belt: 2 | Topic: Tradition | Type: tf
Q: Kata is improvised?
A) True
B) False
Answer: B
Explanation: Kata is pre-arranged forms.`,
  bulkParsed:[],
  bulkDefaultBelt:''
};

function render(){
  try{ renderApp(); }
  catch(e){
    console.error('Admin render failed:', e);
    DojoData.discardDraft().then(()=>{ refreshData(); try{ renderApp(); }catch(e2){ document.getElementById('app').innerHTML='<div style="padding:48px 24px;text-align:center;font-family:sans-serif;font-weight:700">Data error — please reload the page.</div>'; } });
  }
}

function renderApp(){
  const srcLabel=DojoData.getSource();
  const cat=DojoData.getCatalog();
  let body='';
  if(!state.authed){
    body=`
    <div class="max-w-[460px] mx-auto px-4 py-10 lg:py-16">
      <div class="bg-white rounded-[28px] belt-shadow border border-black/5 p-7 text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-[#F5F0FF] border border-[#8E44AD]/20 flex items-center justify-center text-[30px]">⚙️</div>
        <h2 class="fredoka text-[24px] font-bold mt-4">Admin Console</h2>
        <p class="text-[13px] font-medium text-black/60 mt-2 leading-relaxed">The management console for the whole dojo — feed questions, research, dictionary and library, tune settings, and publish catalog.json for every device.</p>
        <form id="pinForm" class="mt-5 space-y-2">
          <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Admin PIN" class="w-full h-12 rounded-2xl border-2 border-black/10 px-4 font-semibold text-[16px] tracking-widest text-center focus:border-black outline-none">
          <button type="submit" class="w-full h-[50px] rounded-full bg-black text-white font-bold fredoka text-[15px] press">Unlock Console →</button>
        </form>
        <p class="text-[11px] font-bold tracking-widest text-black/30 mt-4">DEFAULT PIN: 1234 — CHANGE IT IN SETTINGS</p>
      </div>
    </div>`;
  } else {
    const tabDefs=[['questions','❓ Questions'],['research','📚 Research'],['dictionary','🔤 Dictionary'],['library','🗂️ Library'],['settings','⚙️ Settings']];
    const tabBar=`<div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">${tabDefs.map(t=>`<button data-atab="${t[0]}" class="aTab shrink-0 h-10 px-4 rounded-full text-[12px] font-bold border ${state.tab===t[0]?'bg-black text-white border-black':'bg-white border-black/10'}">${t[1]}</button>`).join('')}</div>`;
    body=tabBar+`<div class="mt-4">${(panels[state.tab]||qPanel)()}</div>`;
  }
  app.innerHTML=`<div class="min-h-screen">
    <header class="sticky top-0 z-30 glass border-b border-black/[0.06]">
      <div class="max-w-[1120px] mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-black text-white flex items-center justify-center font-black fredoka text-[17px]">道</div>
          <div><div class="fredoka font-bold leading-none text-[14px]">ORAL DOJO — ADMIN CONSOLE v2</div><div class="text-[11px] font-semibold text-black/50 tracking-wide">MOVE • COPY • BULK ADD</div></div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-[11px] font-bold tracking-widest bg-[#FAF8F5] border px-3 py-1.5 rounded-full max-w-[260px] truncate" title="${esc(srcLabel)}">DATA: ${esc(srcLabel)}</span>
          <span class="text-[11px] font-bold tracking-widest bg-[#FFF8D6] border border-[#FFD93D]/40 px-3 py-1.5 rounded-full">CATALOG v${esc(cat.version)}</span>
          ${state.authed?'<button id="adExport" class="h-9 px-4 rounded-full bg-black text-[#FFD93D] text-[12px] font-black flex items-center gap-1.5 press">⬇ Export catalog.json</button>':''}
          <a href="oralDojo.html" target="_blank" rel="noopener" class="h-9 px-4 rounded-full bg-white border text-[12px] font-bold flex items-center gap-1.5 press">Open Dojo ↗</a>
          ${state.authed?'<button id="adLock" class="h-9 px-3 rounded-full bg-[#FFF1F1] border border-[#FF4B4B]/30 text-[#9A1A1A] text-[12px] font-bold press">🔒 Lock</button>':''}
        </div>
      </div>
    </header>
    <div class="max-w-[1120px] mx-auto px-4 py-6">${body}</div>
  </div>`;

  document.getElementById('adExport')?.addEventListener('click',doExport);
  document.getElementById('adLock')?.addEventListener('click',()=>{
    sessionStorage.removeItem('oralDojo_admin_auth');
    state.authed=false; state.tab='questions'; state.form=null;
    render(); showToast('Console locked — OSS!');
  });
  if(!state.authed){
    document.getElementById('pinForm').onsubmit=e=>{
      e.preventDefault();
      const val=document.getElementById('pinInput').value.trim();
      if(val===String(settings.adminPin||'1234')){
        state.authed=true; sessionStorage.setItem('oralDojo_admin_auth','1');
        render(); showToast('Welcome, Sensei — console unlocked');
      } else showToast('Wrong PIN — try again');
    };
  } else {
    document.querySelectorAll('.aTab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.atab; state.form=null; render();});
    if(state.tab==='questions') bindQ();
    else if(state.tab==='research') bindR();
    else if(state.tab==='dictionary') bindD();
    else if(state.tab==='library') bindL();
    else bindS();
  }
}

function doExport(){
  const data=DojoData.exportCatalog();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='catalog.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  showToast('catalog.json exported (v'+data.version+') — place it in the dojo root folder');
}

// ---------- BULK PARSER ----------
function parseBulk(raw){
  const chunks = raw.split(/\n\s*---\s*\n|\n---\n|---\n|\n---/).map(s=>s.trim()).filter(Boolean);
  const results=[];
  chunks.forEach((chunk, idx)=>{
    if(!chunk) return;
    const lines = chunk.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    let belt = null, topic='', type='mcq', q='', options=[], answer=null, explanation='';
    let optMap={}; // A->text
    lines.forEach(line=>{
      // handle inline pipe format first line: Belt:1 | Topic: x | Type: mcq
      if(line.includes('|') && /belt:/i.test(line)){
        line.split('|').forEach(p=>parseLine(p.trim()));
        return;
      }
      parseLine(line);
    });
    function parseLine(l){
      const mBelt = l.match(/^belt\s*[:=]\s*(\d+)/i);
      if(mBelt){ belt=parseInt(mBelt[1],10); return; }
      const mTopic = l.match(/^topic\s*[:=]\s*(.+)$/i);
      if(mTopic){ topic=mTopic[1].trim(); return; }
      const mType = l.match(/^type\s*[:=]\s*(mcq|tf|fill|scenario)/i);
      if(mType){ type=mType[1].toLowerCase(); return; }
      const mQ = l.match(/^(q|question)\s*[:=]\s*(.+)$/i);
      if(mQ){ q=mQ[2].trim(); return; }
      const mAnsLetter = l.match(/^(answer|ans|correct)\s*[:=]\s*(.+)$/i);
      if(mAnsLetter){
        const rawAns = mAnsLetter[2].trim();
        // will resolve later
        answer=rawAns;
        return;
      }
      const mExp = l.match(/^(explanation|exp|why)\s*[:=]\s*(.+)$/i);
      if(mExp){ explanation=mExp[2].trim(); return; }
      const mOpt = l.match(/^([A-D]|\d)\s*[\)\.\:\-]\s*(.+)$/i);
      if(mOpt){
        const key=mOpt[1].toUpperCase();
        const txt=mOpt[2].trim();
        if(/^[A-D]$/.test(key)) optMap[key]=txt;
        else {
          // numeric -> convert to letter order
          const idxNum=parseInt(key,10)-1;
          const letter=String.fromCharCode(65+idxNum);
          optMap[letter]=txt;
        }
        return;
      }
      // fallback: if no prefix but we are in options zone? ignore
    }
    // build options array sorted by A,B,C,D
    const sortedKeys = Object.keys(optMap).sort();
    options = sortedKeys.map(k=>optMap[k]);
    // resolve answer index
    let ansIdx=-1;
    if(answer!==null){
      const aStr = String(answer).trim();
      if(/^[A-Da-d]$/.test(aStr)){
        ansIdx = aStr.toUpperCase().charCodeAt(0)-65;
      } else if(/^\d+$/.test(aStr)){
        const n=parseInt(aStr,10);
        ansIdx = n>=0 && n<=3 ? n : n-1; // support 0-based or 1-based
      } else {
        // match by text
        const found = options.findIndex(o=>o.toLowerCase()===aStr.toLowerCase() || o.toLowerCase().includes(aStr.toLowerCase()));
        if(found>=0) ansIdx=found;
      }
    }
    const err=[];
    if(!q) err.push('Missing Q:');
    if(options.length<2) err.push(`Need >=2 options (found ${options.length})`);
    if(ansIdx<0 || ansIdx>=options.length) err.push(`Invalid Answer "${answer}"`);
    if(!topic) err.push('Missing Topic');
    if(!explanation) err.push('Missing Explanation');
    if(!belt && state.bulkDefaultBelt) belt=parseInt(state.bulkDefaultBelt,10);
    if(!belt && state.qBelt!=='all') belt=parseInt(state.qBelt,10);
    if(!belt) belt = belts[0]?.id ?? 0;

    results.push({
      rawIndex: idx,
      belt, topic, type, q, options, answer:ansIdx, answerRaw:answer, explanation,
      errors:err,
      valid: err.length===0
    });
  });
  return results;
}

// ---------- QUESTIONS ----------
const adminQForm=(item)=>{
  const v=item||{belt:(state.qBelt!=='all'?parseInt(state.qBelt,10):(belts[0]?.id||0)),type:'mcq'};
  return `
  <div class="mt-4 bg-white rounded-[24px] border-2 border-[#14B8A6]/40 p-5">
    <h3 class="fredoka font-bold text-[16px]">${item?'Edit Question':'New Question'}</h3>
    <input type="hidden" id="aQFId" value="${esc(v.id||'')}">
    <div class="mt-3 grid sm:grid-cols-3 gap-3">
      <div><label class="text-[11px] font-black tracking-widest text-black/50">BELT</label>
        <select id="aQFBelt" class="mt-1 w-full h-11 rounded-2xl border-2 border-black/10 bg-[#FAF8F5] px-3 font-semibold text-[13px] focus:border-black outline-none">${belts.map(b=>`<option value="${b.id}" ${String(v.belt)===String(b.id)?'selected':''}>${b.short} • ${b.from} → ${b.to}</option>`).join('')}</select></div>
      <div><label class="text-[11px] font-black tracking-widest text-black/50">TYPE</label>
        <select id="aQFType" class="mt-1 w-full h-11 rounded-2xl border-2 border-black/10 bg-[#FAF8F5] px-3 font-semibold text-[13px] focus:border-black outline-none">${['mcq','tf','fill','scenario'].map(t=>`<option value="${t}" ${v.type===t?'selected':''}>${t.toUpperCase()}</option>`).join('')}</select></div>
      <div><label class="text-[11px] font-black tracking-widest text-black/50">TOPIC</label>
        <input id="aQFTopic" value="${esc(v.topic||'')}" placeholder="e.g. Tradition • Osu" class="mt-1 w-full h-11 rounded-2xl border-2 border-black/10 px-3 font-semibold text-[13px] focus:border-black outline-none"></div>
    </div>
    <div class="mt-3"><label class="text-[11px] font-black tracking-widest text-black/50">QUESTION</label>
      <textarea id="aQFQ" rows="2" class="mt-1 w-full rounded-2xl border-2 border-black/10 px-3 py-2 font-semibold text-[14px] focus:border-black outline-none">${esc(v.q||'')}</textarea></div>
    <div class="mt-3"><label class="text-[11px] font-black tracking-widest text-black/50">OPTIONS</label>
      <div id="aQFOpts" class="mt-1 space-y-2"></div></div>
    <div class="mt-3 grid sm:grid-cols-[160px_1fr] gap-3">
      <div><label class="text-[11px] font-black tracking-widest text-black/50">CORRECT</label>
        <select id="aQFAns" class="mt-1 w-full h-11 rounded-2xl border-2 border-black/10 bg-[#FAF8F5] px-3 font-semibold text-[13px] focus:border-black outline-none"></select></div>
      <div><label class="text-[11px] font-black tracking-widest text-black/50">WHY IS IT CORRECT? (EXPLANATION)</label>
        <textarea id="aQFEx" rows="2" class="mt-1 w-full rounded-2xl border-2 border-black/10 px-3 py-2 font-semibold text-[14px] focus:border-black outline-none">${esc(v.explanation||'')}</textarea></div>
    </div>
    <div class="mt-4 grid grid-cols-2 gap-2">
      <button id="aQSave" class="h-12 rounded-full bg-black text-white font-bold fredoka text-[14px] press">Save Question</button>
      <button id="aQCancel" class="h-12 rounded-full bg-[#FAF8F5] border font-bold fredoka text-[14px] press">Cancel</button>
    </div>
  </div>`;
};

const bulkPanel=()=>{
  if(!state.bulkOpen) return '';
  return `
  <div class="mt-4 bg-[#0F0F0F] rounded-[24px] border border-[#FFD93D]/20 p-5 text-white">
    <div class="flex items-center justify-between gap-2">
      <h3 class="fredoka font-bold text-[16px]">📦 Bulk Add Questions</h3>
      <button id="aBulkClose" class="h-8 px-3 rounded-full bg-white/10 border border-white/10 text-[12px] font-bold">Close</button>
    </div>
    <p class="text-[12px] text-white/60 mt-2 leading-relaxed">Paste many questions at once. Separate each with <b>---</b>. Options as <b>A) ... B) ...</b> or <b>1) ...</b>. Answer as <b>A</b> or <b>0</b> or full text. Belt can be set per question or use the default below.</p>
    <div class="mt-3 grid sm:grid-cols-2 gap-3">
      <div><label class="text-[10px] font-black tracking-widest text-white/50">DEFAULT BELT IF NOT SPECIFIED</label>
        <select id="aBulkBelt" class="mt-1 w-full h-11 rounded-2xl border border-white/10 bg-white/10 px-3 font-semibold text-[13px] outline-none text-white">${belts.map(b=>`<option value="${b.id}" ${String(state.bulkDefaultBelt)===String(b.id)?'selected':''} style="color:black">${b.short} • ${b.from} → ${b.to}</option>`).join('')}</select></div>
      <div class="flex items-end gap-2">
        <button id="aBulkParse" class="h-11 flex-1 rounded-full bg-[#FFD93D] text-black font-black text-[13px] press">Preview / Validate</button>
        <button id="aBulkImport" class="h-11 flex-1 rounded-full bg-[#14B8A6] text-black font-black text-[13px] press">Import ${state.bulkParsed.filter(x=>x.valid).length||''} Valid</button>
      </div>
    </div>
    <textarea id="aBulkText" rows="16" class="mt-3 w-full rounded-2xl border border-white/10 bg-white/5 px-3 py-3 font-mono text-[12px] leading-relaxed outline-none focus:border-[#FFD93D]/40">${esc(state.bulkText)}</textarea>
    <div id="aBulkPreview" class="mt-3 space-y-2 max-h-[320px] overflow-auto pr-1">
      ${state.bulkParsed.map((p,i)=>`
        <div class="rounded-2xl border p-3 ${p.valid?'bg-white/5 border-white/10':'bg-[#FF4B4B]/10 border-[#FF4B4B]/30'}">
          <div class="flex items-center gap-2 text-[11px] font-black tracking-widest">
            <span class="${p.valid?'bg-[#14B8A6] text-black':'bg-[#FF4B4B] text-white'} px-2 py-0.5 rounded-full">${p.valid?'OK':'ERR'}</span>
            <span class="text-white/50">Belt ${p.belt} • ${esc(p.topic||'no topic')} • ${esc(p.type)} • Ans ${p.answer>=0?String.fromCharCode(65+p.answer):esc(p.answerRaw||'?')}</span>
          </div>
          <div class="text-[12px] font-bold mt-1 leading-snug">${esc(p.q||'(no question)')}</div>
          <div class="text-[11px] text-white/60 mt-1">${p.options.map((o,oi)=>`<span class="${oi===p.answer?'text-[#FFD93D] font-bold':''}">${String.fromCharCode(65+oi)}) ${esc(o)}</span>`).join(' • ')}</div>
          ${p.errors.length?`<div class="text-[11px] text-[#FF8A8A] mt-1 font-bold">${esc(p.errors.join(' | '))}</div>`:''}
        </div>
      `).join('') || '<div class="text-[12px] text-white/40 text-center py-4">Click Preview to validate</div>'}
    </div>
    <div class="mt-3 bg-white/5 rounded-2xl p-3 border border-white/10">
      <div class="text-[11px] font-black tracking-widest text-white/50">PATTERN EXAMPLE</div>
      <pre class="mt-1 text-[11px] font-mono leading-relaxed text-white/70 whitespace-pre-wrap">Belt: 1
Topic: Concepts
Type: mcq
Q: What does Dojo mean?
A) Place of the way
B) Fighting arena
C) Meditation hall
D) Weapon store
Answer: A
Explanation: Dojo = place of the way
---
Belt: 2 | Topic: Tradition | Type: tf
Q: Kata is improvised?
A) True
B) False
Answer: B
Explanation: Kata is pre-arranged.</pre>
    </div>
  </div>`;
};

const qPanel=()=>{
  const allQ=DojoData.getQuestions();
  const form=state.form&&state.form.kind==='q'?adminQForm(state.form.item):'';
  const filtered=(state.qBelt==='all'?allQ:allQ.filter(q=>q.belt===parseInt(state.qBelt,10))).slice().sort((a,b)=>a.belt-b.belt||String(a.id).localeCompare(String(b.id)));
  const selCount=state.selected.size;
  return `
  <div class="flex flex-col lg:flex-row gap-2 lg:items-center">
    <select id="aQBeltFilter" class="h-11 rounded-2xl border-2 border-black/10 bg-white px-3 font-semibold text-[13px] focus:border-black outline-none flex-1">
      <option value="all" ${state.qBelt==='all'?'selected':''}>All belts (${allQ.length})</option>
      ${belts.map(b=>`<option value="${b.id}" ${String(state.qBelt)===String(b.id)?'selected':''}>${b.short} • ${b.from} → ${b.to} (${(questions[b.id]||[]).length})</option>`).join('')}
    </select>
    <div class="flex gap-2">
      <button id="aQBulk" class="h-11 px-5 rounded-full bg-[#FFD93D] border border-black/10 text-black font-black text-[13px] press shrink-0">📦 Bulk Add</button>
      <button id="aQAdd" class="h-11 px-5 rounded-full bg-black text-white font-bold text-[13px] press shrink-0">+ Add Question</button>
    </div>
  </div>
  ${bulkPanel()}
  ${form}
  ${selCount>0?`
  <div class="mt-4 bg-black text-white rounded-[20px] p-3 flex flex-wrap items-center gap-2 border border-[#FFD93D]/20">
    <span class="text-[12px] font-black px-2">${selCount} selected</span>
    <button id="aSelAll" class="h-9 px-3 rounded-full bg-white/10 border border-white/10 text-[11px] font-bold">Select all ${filtered.length}</button>
    <button id="aSelClear" class="h-9 px-3 rounded-full bg-white/10 border border-white/10 text-[11px] font-bold">Clear</button>
    <div class="h-6 w-px bg-white/10"></div>
    <select id="aBulkTargetBelt" class="h-9 rounded-full bg-white text-black px-3 font-bold text-[11px] outline-none">${belts.map(b=>`<option value="${b.id}">${b.short}</option>`).join('')}</select>

function bindQ(){
  const wrap=document.getElementById('aQFOpts');
  // Top controls
  document.getElementById('aQAdd').onclick=()=>{state.form={kind:'q', item:null}; state.bulkOpen=false; render();};
  document.getElementById('aQBulk').onclick=()=>{state.bulkOpen=!state.bulkOpen; state.form=null; render();};
  document.getElementById('aQBeltFilter').onchange=e=>{state.qBelt=e.target.value; state.selected.clear(); state.form=null; render();};

  document.querySelectorAll('[data-qedit]').forEach(b=>b.onclick=()=>{
    const q=DojoData.getQuestions().find(x=>String(x.id)===String(b.dataset.qedit));
    state.form={kind:'q', item:JSON.parse(JSON.stringify(q))}; state.bulkOpen=false; render();
  });
  document.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>arm(b,async()=>{
    await DojoData.deleteQuestion(b.dataset.qdel); state.form=null; refreshData(); render(); showToast('Question deleted');
  }));

  // selection
  document.querySelectorAll('[data-qsel]').forEach(cb=>{
    cb.onchange=()=>{ if(cb.checked) state.selected.add(String(cb.dataset.qsel)); else state.selected.delete(String(cb.dataset.qsel)); render(); };
  });
  document.getElementById('aSelAll')?.addEventListener('click',()=>{
    const allQ=DojoData.getQuestions();
    const filtered=(state.qBelt==='all'?allQ:allQ.filter(q=>q.belt===parseInt(state.qBelt,10)));
    filtered.forEach(q=>state.selected.add(String(q.id)));
    render();
  });
  document.getElementById('aSelClear')?.addEventListener('click',()=>{ state.selected.clear(); render(); });

  // bulk move/copy per card quick
  document.querySelectorAll('[data-qmove]').forEach(sel=>{
    sel.onchange=async()=>{
      const val=sel.value; if(!val) return;
      const [action, beltIdStr]=val.split('-');
      const beltId=parseInt(beltIdStr,10);
      const qId=sel.dataset.qmove;
      const srcQ=DojoData.getQuestions().find(x=>String(x.id)===String(qId));
      if(!srcQ){ showToast('Question not found'); return; }
      if(action==='move'){
        await DojoData.upsertQuestion({...srcQ, belt:beltId});
      } else {
        const copy={...JSON.parse(JSON.stringify(srcQ)), id:'q'+beltId+'-'+Date.now()+'-'+Math.floor(Math.random()*9999), belt:beltId};
        await DojoData.upsertQuestion(copy);
      }
      refreshData(); render(); showToast(action==='move'?`Moved to ${belts.find(b=>b.id===beltId)?.short||beltId}`:`Copied to ${belts.find(b=>b.id===beltId)?.short||beltId}`);
    };
  });

  // bulk toolbar actions
  const doBulkAction=async (mode)=>{
    const targetBelt=parseInt(document.getElementById('aBulkTargetBelt')?.value||belts[0]?.id,10);
    if(state.selected.size===0){ showToast('Select questions first'); return; }
    const ids=[...state.selected];
    let count=0;
    for(const id of ids){
      const srcQ=DojoData.getQuestions().find(x=>String(x.id)===String(id));
      if(!srcQ) continue;
      if(mode==='move'){
        await DojoData.upsertQuestion({...srcQ, belt:targetBelt});
        count++;
      } else if(mode==='copy'){
        const copy={...JSON.parse(JSON.stringify(srcQ)), id:'q'+targetBelt+'-'+Date.now()+'-'+count+'-'+Math.floor(Math.random()*9999), belt:targetBelt};
        await DojoData.upsertQuestion(copy);
        count++;
      } else if(mode==='delete'){
        await DojoData.deleteQuestion(id);
        count++;
      }
    }
    refreshData();
    if(mode!=='copy') state.selected.clear();
    render();
    showToast(mode==='move'?`${count} moved to ${belts.find(b=>b.id===targetBelt)?.short||targetBelt}`: mode==='copy'?`${count} copied to ${belts.find(b=>b.id===targetBelt)?.short||targetBelt}`:`${count} deleted`);
  };
  document.getElementById('aBulkMove')?.addEventListener('click',()=>doBulkAction('move'));
  document.getElementById('aBulkCopy')?.addEventListener('click',()=>doBulkAction('copy'));
  document.getElementById('aBulkDel')?.addEventListener('click',()=>arm(document.getElementById('aBulkDel'),()=>doBulkAction('delete')));

  // bulk importer bindings
  if(state.bulkOpen){
    const bulkTextEl=document.getElementById('aBulkText');
    const bulkBeltEl=document.getElementById('aBulkBelt');
    if(bulkTextEl){
      bulkTextEl.addEventListener('input',e=>{ state.bulkText=e.target.value; });
    }
    if(bulkBeltEl){
      bulkBeltEl.addEventListener('change',e=>{ state.bulkDefaultBelt=e.target.value; });
    }
    document.getElementById('aBulkClose')?.addEventListener('click',()=>{ state.bulkOpen=false; render(); });
    document.getElementById('aBulkParse')?.addEventListener('click',()=>{
      state.bulkText=document.getElementById('aBulkText').value;
      state.bulkDefaultBelt=document.getElementById('aBulkBelt').value;
      state.bulkParsed=parseBulk(state.bulkText);
      render();
      showToast(`${state.bulkParsed.filter(x=>x.valid).length}/${state.bulkParsed.length} valid — ready to import`);
    });
    document.getElementById('aBulkImport')?.addEventListener('click',async()=>{
      // ensure parsed
      if(state.bulkParsed.length===0){
        state.bulkText=document.getElementById('aBulkText').value;
        state.bulkParsed=parseBulk(state.bulkText);
      }
      const valids=state.bulkParsed.filter(x=>x.valid);
      if(valids.length===0){ showToast('No valid questions to import'); return; }
      let imported=0;
      for(const p of valids){
        const item={
          id:'q'+p.belt+'-'+Date.now()+'-'+imported+'-'+Math.floor(Math.random()*9999),
          belt:p.belt,
          type:p.type,
          topic:p.topic,
          q:p.q,
          options:p.options,
          answer:p.answer,
          explanation:p.explanation
        };
        await DojoData.upsertQuestion(item);
        imported++;
      }
      refreshData();
      showToast(`${imported} questions imported — OSS!`);
      state.bulkOpen=false;
      state.bulkParsed=[];
      render();
    });
  }

  if(!wrap) return;
  const typeSel=document.getElementById('aQFType');
  const ansSel=document.getElementById('aQFAns');
  const build=(preserve)=>{
    const n=typeSel.value==='tf'?2:4;
    const prev=preserve?[...wrap.querySelectorAll('input')].map(i=>i.value):[];
    const base=(state.form&&state.form.item&&state.form.item.options)||[];
    wrap.innerHTML=[...Array(n)].map((_,i)=>{
      const val=prev[i]!==undefined?prev[i]:(base[i]||'');
      return `<input data-oi="${i}" placeholder="Option ${String.fromCharCode(65+i)}" value="${esc(val)}" class="w-full h-11 rounded-2xl border-2 border-black/10 px-3 font-semibold text-[14px] focus:border-black outline-none">`;
    }).join('');
    ansSel.innerHTML=[...Array(n)].map((_,i)=>`<option value="${i}">${String.fromCharCode(65+i)}</option>`).join('');
    const a=(state.form&&state.form.item)?state.form.item.answer:0;
    ansSel.value=String(Math.min(a,n-1));
  };
  build(false);
  typeSel.onchange=()=>build(true);
  document.getElementById('aQCancel').onclick=()=>{state.form=null; render();};
  document.getElementById('aQSave').onclick=async()=>{
    const opts=[...wrap.querySelectorAll('input')].map(i=>i.value.trim());
    const item={
      id:document.getElementById('aQFId').value||('q'+document.getElementById('aQFBelt').value+'-'+Date.now()),
      belt:parseInt(document.getElementById('aQFBelt').value,10),
      type:typeSel.value,
      topic:document.getElementById('aQFTopic').value.trim(),
      q:document.getElementById('aQFQ').value.trim(),
      options:opts,
      answer:parseInt(ansSel.value,10),
      explanation:document.getElementById('aQFEx').value.trim()
    };
    const prev=(state.form&&state.form.item)||{};
    if(prev.emojiOptions&&prev.emojiOptions.length===opts.length) item.emojiOptions=prev.emojiOptions;
    if(!item.topic||!item.q||!item.explanation||opts.some(o=>!o)){ showToast('Please fill every field, sensei'); return; }
    await DojoData.upsertQuestion(item);
    state.form=null; refreshData(); render(); showToast('Question saved — OSS!');
  };
}

function bindS(){
  document.getElementById('aExport2').onclick=doExport;
  document.getElementById('aImportFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const obj=JSON.parse(await f.text());
      await DojoData.importCatalog(obj);
      refreshData(); render();
      showToast('Catalog imported — OSS!');
    }catch(err){ showToast('Invalid catalog file'); }
  };
  document.getElementById('aDiscard')?.addEventListener('click',async()=>{
    await DojoData.discardDraft(); refreshData(); render(); showToast('Global catalog reloaded');
  });
  document.getElementById('aSaveSettings').onclick=async()=>{
    const wa=document.getElementById('aWa').value.trim().replace(/[^\d]/g,'');
    const em=document.getElementById('aEmail').value.trim();
    const pin=document.getElementById('aPin').value.trim();
    if(!wa||!em||!pin){ showToast('All settings fields are required'); return; }
    await DojoData.updateSettings({senseiWhatsApp:wa,senseiEmail:em,adminPin:pin});
    refreshData(); render(); showToast('Settings saved — OSS!');
  };
