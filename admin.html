  const el=document.createElement('div');

  el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] bg-black text-white text-[13px] font-bold px-5 py-3 rounded-full shadow-2xl border border-[#FFD93D]/30 flex items-center gap-2';

function doExport(){
  const data=DojoData.exportCatalog();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='catalog.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  showToast('catalog.json exported v'+data.version+' — OSS!');
}

// ---------- BULK PARSERS (same as v3) ----------
function parseBulk(raw){
  const chunks = raw.split(/\n\s*---\s*\n|\n---\n|---\n|\n---/).map(s=>s.trim()).filter(Boolean);
  const results=[];
  chunks.forEach((chunk, idx)=>{
    if(!chunk) return;
    const lines = chunk.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    let belt = null, topic='', type='mcq', q='', options=[], answer=null, explanation='';
    let optMap={};
    lines.forEach(line=>{
      if(line.includes('|') && /belt:/i.test(line)){
        line.split('|').forEach(p=>parseLine(p.trim()));
        return;
      }
      parseLine(line);
    });
    function parseLine(l){
      const mBelt = l.match(/^belt\s*[:=]\s*(\d+)/i);
      if(mBelt){ belt=parseInt(mBelt[1],10); return; }
      const mTopic = l.match(/^topic\s*[:=]\s*(.+)$/i);
      if(mTopic){ topic=mTopic[1].trim(); return; }
      const mType = l.match(/^type\s*[:=]\s*(mcq|tf|fill|scenario)/i);
      if(mType){ type=mType[1].toLowerCase(); return; }
      const mQ = l.match(/^(q|question)\s*[:=]\s*(.+)$/i);
      if(mQ){ q=mQ[2].trim(); return; }
      const mAnsLetter = l.match(/^(answer|ans|correct)\s*[:=]\s*(.+)$/i);
      if(mAnsLetter){ answer=mAnsLetter[2].trim(); return; }
      const mExp = l.match(/^(explanation|exp|why)\s*[:=]\s*(.+)$/i);
      if(mExp){ explanation=mExp[2].trim(); return; }
      const mOpt = l.match(/^([A-D]|\d)\s*[\)\.\:\-]\s*(.+)$/i);
      if(mOpt){
        const key=mOpt[1].toUpperCase();
        const txt=mOpt[2].trim();
        if(/^[A-D]$/.test(key)) optMap[key]=txt;
        else {
          const idxNum=parseInt(key,10)-1;
          const letter=String.fromCharCode(65+idxNum);
          optMap[letter]=txt;
        }
        return;
      }
    }
    const sortedKeys = Object.keys(optMap).sort();
    options = sortedKeys.map(k=>optMap[k]);
    let ansIdx=-1;
    if(answer!==null){
      const aStr = String(answer).trim();
      if(/^[A-Da-d]$/.test(aStr)){ ansIdx = aStr.toUpperCase().charCodeAt(0)-65; }
      else if(/^\d+$/.test(aStr)){ const n=parseInt(aStr,10); ansIdx = n>=0 && n<=3 ? n : n-1; }
      else { const found = options.findIndex(o=>o.toLowerCase()===aStr.toLowerCase() || o.toLowerCase().includes(aStr.toLowerCase())); if(found>=0) ansIdx=found; }
    }
    const err=[];
    if(!q) err.push('Missing Q:');
    if(options.length<2) err.push(`Need >=2 options (${options.length})`);
    if(ansIdx<0 || ansIdx>=options.length) err.push(`Invalid Answer "${answer}"`);
    if(!topic) err.push('Missing Topic');
    if(!explanation) err.push('Missing Explanation');
    if(!belt && state.bulkDefaultBelt) belt=parseInt(state.bulkDefaultBelt,10);
    if(!belt && state.qBelt!=='all') belt=parseInt(state.qBelt,10);
    if(!belt) belt = belts[0]?.id ?? 0;
    results.push({ rawIndex: idx, belt, topic, type, q, options, answer:ansIdx, answerRaw:answer, explanation, errors:err, valid: err.length===0 });
  });
  return results;
}
function parseDictBulk(raw){
  const chunks = raw.split(/\n\s*---\s*\n|\n---\n|---\n|\n---/).map(s=>s.trim()).filter(Boolean);
  const results=[];
  chunks.forEach(chunk=>{
    const lines = chunk.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    let term='', reading='', category='Concepts', definition='';
    lines.forEach(l=>{
      let m;
      m = l.match(/^term\s*[:=]\s*(.+)$/i); if(m){ term=m[1].trim(); return; }
      m = l.match(/^reading\s*[:=]\s*(.+)$/i); if(m){ reading=m[1].trim(); return; }
      m = l.match(/^category\s*[:=]\s*(.+)$/i); if(m){ category=m[1].trim(); return; }
      m = l.match(/^definition\s*[:=]\s*(.+)$/i); if(m){ definition=m[1].trim(); return; }
      m = l.match(/^def\s*[:=]\s*(.+)$/i); if(m){ definition=m[1].trim(); return; }
      if(definition && !l.includes(':')){ definition += ' ' + l; }
    });
    const err=[]; if(!term) err.push('Missing Term'); if(!definition) err.push('Missing Definition');
    results.push({ term, reading, category, definition, errors:err, valid: err.length===0 });
  });
  return results;
}
function parseLibBulk(raw){
  const chunks = raw.split(/\n\s*---\s*\n|\n---\n|---\n|\n---/).map(s=>s.trim()).filter(Boolean);
  const results=[];
  chunks.forEach(chunk=>{
    const lines = chunk.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    let title='', author='', type='book', category='General', description='', url='';
    lines.forEach(l=>{
      let m;
      m = l.match(/^title\s*[:=]\s*(.+)$/i); if(m){ title=m[1].trim(); return; }
      m = l.match(/^author\s*[:=]\s*(.+)$/i); if(m){ author=m[1].trim(); return; }
      m = l.match(/^type\s*[:=]\s*(book|article|video|tool)/i); if(m){ type=m[1].toLowerCase(); return; }
      m = l.match(/^category\s*[:=]\s*(.+)$/i); if(m){ category=m[1].trim(); return; }
      m = l.match(/^description\s*[:=]\s*(.+)$/i); if(m){ description=m[1].trim(); return; }
      m = l.match(/^desc\s*[:=]\s*(.+)$/i); if(m){ description=m[1].trim(); return; }
      m = l.match(/^url\s*[:=]\s*(.+)$/i); if(m){ url=m[1].trim(); return; }
      if(description && !l.includes(':')){ description += ' ' + l; }
    });
    const err=[]; if(!title) err.push('Missing Title'); if(!description) err.push('Missing Description');
    results.push({ title, author, type, category, description, url, errors:err, valid: err.length===0 });
  });
  return results;
}

function bindQ(){
  const wrap=document.getElementById('aQFOpts');
  document.getElementById('aQAdd').onclick=()=>{state.form={kind:'q', item:null}; state.bulkOpen=false; render();};
  document.getElementById('aQBulk').onclick=()=>{state.bulkOpen=!state.bulkOpen; state.form=null; render();};
  document.getElementById('aQBeltFilter').onchange=e=>{state.qBelt=e.target.value; state.selected.clear(); state.form=null; render();};
  document.querySelectorAll('[data-qedit]').forEach(b=>b.onclick=()=>{
    const q=DojoData.getQuestions().find(x=>String(x.id)===String(b.dataset.qedit));
    state.form={kind:'q', item:JSON.parse(JSON.stringify(q))}; state.bulkOpen=false; render();
  });
  document.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>arm(b,async()=>{
    await DojoData.deleteQuestion(b.dataset.qdel); state.form=null; refreshData(); render(); showToast('Question deleted');
  }));
  document.querySelectorAll('[data-qsel]').forEach(cb=>{
    cb.onchange=()=>{ if(cb.checked) state.selected.add(String(cb.dataset.qsel)); else state.selected.delete(String(cb.dataset.qsel)); render(); };
  });
  document.getElementById('aSelAll')?.addEventListener('click',()=>{
    const allQ=DojoData.getQuestions();
    const filtered=(state.qBelt==='all'?allQ:allQ.filter(q=>q.belt===parseInt(state.qBelt,10)));
    filtered.forEach(q=>state.selected.add(String(q.id)));
    render();
  });
  document.getElementById('aSelClear')?.addEventListener('click',()=>{ state.selected.clear(); render(); });
  document.querySelectorAll('[data-qmove]').forEach(sel=>{
    sel.onchange=async()=>{
      const val=sel.value; if(!val) return;
      const [action, beltIdStr]=val.split('-');
      const beltId=parseInt(beltIdStr,10);
      const qId=sel.dataset.qmove;
      const srcQ=DojoData.getQuestions().find(x=>String(x.id)===String(qId));
      if(!srcQ){ showToast('Question not found'); return; }
      if(action==='move'){ await DojoData.upsertQuestion({...srcQ, belt:beltId}); }
      else { const copy={...JSON.parse(JSON.stringify(srcQ)), id:'q'+beltId+'-'+Date.now()+'-'+Math.floor(Math.random()*9999), belt:beltId}; await DojoData.upsertQuestion(copy); }
      refreshData(); render(); showToast(action==='move'?`Moved to ${belts.find(b=>b.id===beltId)?.short||beltId}`:`Copied to ${belts.find(b=>b.id===beltId)?.short||beltId}`);
    };
  });
  const doBulkAction=async (mode)=>{
    const targetBelt=parseInt(document.getElementById('aBulkTargetBelt')?.value||belts[0]?.id,10);
    if(state.selected.size===0){ showToast('Select questions first'); return; }
    const ids=[...state.selected]; let count=0;
    for(const id of ids){
      const srcQ=DojoData.getQuestions().find(x=>String(x.id)===String(id)); if(!srcQ) continue;
      if(mode==='move'){ await DojoData.upsertQuestion({...srcQ, belt:targetBelt}); count++; }
      else if(mode==='copy'){ const copy={...JSON.parse(JSON.stringify(srcQ)), id:'q'+targetBelt+'-'+Date.now()+'-'+count+'-'+Math.floor(Math.random()*9999), belt:targetBelt}; await DojoData.upsertQuestion(copy); count++; }
      else if(mode==='delete'){ await DojoData.deleteQuestion(id); count++; }
    }
    refreshData(); if(mode!=='copy') state.selected.clear(); render();
    showToast(mode==='move'?`${count} moved` : mode==='copy'?`${count} copied`:`${count} deleted`);
  };
  document.getElementById('aBulkMove')?.addEventListener('click',()=>doBulkAction('move'));
  document.getElementById('aBulkCopy')?.addEventListener('click',()=>doBulkAction('copy'));
  document.getElementById('aBulkDel')?.addEventListener('click',()=>arm(document.getElementById('aBulkDel'),()=>doBulkAction('delete')));
  if(state.bulkOpen){
    const bulkTextEl=document.getElementById('aBulkText');
    const bulkBeltEl=document.getElementById('aBulkBelt');
    if(bulkTextEl){ bulkTextEl.addEventListener('input',e=>{ state.bulkText=e.target.value; }); }
    if(bulkBeltEl){ bulkBeltEl.addEventListener('change',e=>{ state.bulkDefaultBelt=e.target.value; }); }
    document.getElementById('aBulkClose')?.addEventListener('click',()=>{ state.bulkOpen=false; render(); });
    document.getElementById('aBulkParse')?.addEventListener('click',()=>{
      state.bulkText=document.getElementById('aBulkText').value;
      state.bulkDefaultBelt=document.getElementById('aBulkBelt').value;
      state.bulkParsed=parseBulk(state.bulkText);
      render(); showToast(`${state.bulkParsed.filter(x=>x.valid).length}/${state.bulkParsed.length} valid`);
    });
    document.getElementById('aBulkImport')?.addEventListener('click',async()=>{
      if(state.bulkParsed.length===0){ state.bulkText=document.getElementById('aBulkText').value; state.bulkParsed=parseBulk(state.bulkText); }
      const valids=state.bulkParsed.filter(x=>x.valid);
      if(valids.length===0){ showToast('No valid questions'); return; }
      let imported=0;
      for(const p of valids){
        const item={ id:'q'+p.belt+'-'+Date.now()+'-'+imported+'-'+Math.floor(Math.random()*9999), belt:p.belt, type:p.type, topic:p.topic, q:p.q, options:p.options, answer:p.answer, explanation:p.explanation };
        await DojoData.upsertQuestion(item); imported++;
      }
      refreshData(); showToast(`${imported} questions imported — OSS!`); state.bulkOpen=false; state.bulkParsed=[]; render();
    });
  }
  if(!wrap) return;
  const typeSel=document.getElementById('aQFType');
  const ansSel=document.getElementById('aQFAns');
  const build=(preserve)=>{
    const n=typeSel.value==='tf'?2:4;
    const prev=preserve?[...wrap.querySelectorAll('input')].map(i=>i.value):[];
    const base=(state.form&&state.form.item&&state.form.item.options)||[];
    wrap.innerHTML=[...Array(n)].map((_,i)=>{
      const val=prev[i]!==undefined?prev[i]:(base[i]||'');
      return `<input data-oi="${i}" placeholder="Option ${String.fromCharCode(65+i)}" value="${esc(val)}" class="w-full h-11 rounded-2xl border-2 border-black/10 px-3 font-semibold text-[14px] focus:border-black outline-none">`;
    }).join('');
    ansSel.innerHTML=[...Array(n)].map((_,i)=>`<option value="${i}">${String.fromCharCode(65+i)}</option>`).join('');
    const a=(state.form&&state.form.item)?state.form.item.answer:0;
    ansSel.value=String(Math.min(a,n-1));
  };
  build(false);
  typeSel.onchange=()=>build(true);
  document.getElementById('aQCancel').onclick=()=>{state.form=null; render();};
  document.getElementById('aQSave').onclick=async()=>{
    const opts=[...wrap.querySelectorAll('input')].map(i=>i.value.trim());
    const item={
      id:document.getElementById('aQFId').value||('q'+document.getElementById('aQFBelt').value+'-'+Date.now()),
      belt:parseInt(document.getElementById('aQFBelt').value,10),
      type:typeSel.value,
      topic:document.getElementById('aQFTopic').value.trim(),
      q:document.getElementById('aQFQ').value.trim(),
      options:opts,
      answer:parseInt(ansSel.value,10),
      explanation:document.getElementById('aQFEx').value.trim()
    };
    if(!item.topic||!item.q||!item.explanation||opts.some(o=>!o)){ showToast('Please fill every field, sensei'); return; }
    await DojoData.upsertQuestion(item);
    state.form=null; refreshData(); render(); showToast('Question saved — OSS!');
  };
}

  if(!document.getElementById('aDSave')) return;
  document.getElementById('aDCancel').onclick=()=>{state.form=null; render();};
  document.getElementById('aDSave').onclick=async()=>{
    const item={
      id:document.getElementById('aDId').value||('d'+Date.now()),
      term:document.getElementById('aDTerm').value.trim(),
      reading:document.getElementById('aDReading').value.trim(),
      category:document.getElementById('aDCat').value.trim()||'Concepts',
      definition:document.getElementById('aDDef').value.trim()
    };
    if(!item.term||!item.definition){ showToast('Term and definition required'); return; }
    await DojoData.upsertDictionary(item);
    state.form=null; refreshData(); render(); showToast('Term saved — OSS!');
  };
}
function bindL(){
  document.getElementById('aLAdd').onclick=()=>{state.form={kind:'lib', item:null}; state.bulkLibOpen=false; render();};
  document.getElementById('aLBulk').onclick=()=>{state.bulkLibOpen=!state.bulkLibOpen; state.form=null; render();};
  document.querySelectorAll('[data-ledit]').forEach(b=>b.onclick=()=>{
    const l=DojoData.getLibrary().find(x=>String(x.id)===String(b.dataset.ledit));
    state.form={kind:'lib', item:JSON.parse(JSON.stringify(l))}; state.bulkLibOpen=false; render();
  });
  document.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=()=>arm(b,async()=>{
    await DojoData.deleteLibrary(b.dataset.ldel); state.form=null; refreshData(); render(); showToast('Resource deleted');
  }));
  if(state.bulkLibOpen){
    document.getElementById('aBulkLibClose')?.addEventListener('click',()=>{ state.bulkLibOpen=false; render(); });
    document.getElementById('aBulkLibParse')?.addEventListener('click',()=>{
      state.bulkLibText=document.getElementById('aBulkLibText').value;
      state.bulkLibParsed=parseLibBulk(state.bulkLibText);
      render(); showToast(`${state.bulkLibParsed.filter(x=>x.valid).length}/${state.bulkLibParsed.length} valid`);
    });
    document.getElementById('aBulkLibImport')?.addEventListener('click',async()=>{
      if(state.bulkLibParsed.length===0){ state.bulkLibText=document.getElementById('aBulkLibText').value; state.bulkLibParsed=parseLibBulk(state.bulkLibText); }
      const valids=state.bulkLibParsed.filter(x=>x.valid);
      if(valids.length===0){ showToast('No valid resources'); return; }
      let imported=0;
      for(const p of valids){
        const item={ id:'l'+Date.now()+'-'+imported+'-'+Math.floor(Math.random()*9999), title:p.title, author:p.author||'', type:p.type||'book', category:p.category||'General', description:p.description, url:p.url||'' };
        await DojoData.upsertLibrary(item); imported++;
      }
      refreshData(); showToast(`${imported} resources imported — OSS!`); state.bulkLibOpen=false; state.bulkLibParsed=[]; render();
    });
  }
  if(!document.getElementById('aLSave')) return;
  document.getElementById('aLCancel').onclick=()=>{state.form=null; render();};
  document.getElementById('aLSave').onclick=async()=>{
    const item={
      id:document.getElementById('aLId').value||('l'+Date.now()),
      title:document.getElementById('aLTitle').value.trim(),
      author:document.getElementById('aLAuthor').value.trim(),
      type:document.getElementById('aLType').value,
      category:document.getElementById('aLCat').value.trim()||'General',
      description:document.getElementById('aLDesc').value.trim(),
      url:document.getElementById('aLUrl').value.trim()
    };
    if(!item.title||!item.description){ showToast('Title and description required'); return; }
    await DojoData.upsertLibrary(item);
    state.form=null; refreshData(); render(); showToast('Resource saved — OSS!');
  };
}
function bindS(){
  document.getElementById('aExport2').onclick=doExport;
  document.getElementById('aImportFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const obj=JSON.parse(await f.text());
      await DojoData.importCatalog(obj);
      refreshData(); render(); playPageIn();
      showToast('Catalog imported — OSS!');
    }catch(err){ showToast('Invalid catalog file'); }
  };
  document.getElementById('aDiscard')?.addEventListener('click',async()=>{
    await DojoData.discardDraft(); refreshData(); render(); playPageIn(); showToast('Global catalog reloaded');
  });
  document.getElementById('aSaveSettings').onclick=async()=>{
    const wa=document.getElementById('aWa').value.trim().replace(/[^\d]/g,'');
    const em=document.getElementById('aEmail').value.trim();
    const pin=document.getElementById('aPin').value.trim();
    if(!wa||!em||!pin){ showToast('All settings fields required'); return; }
    await DojoData.updateSettings({senseiWhatsApp:wa,senseiEmail:em,adminPin:pin});
    refreshData(); render(); playPageIn(); showToast('Settings saved — OSS!');
  };
}

render(); playPageIn();
console.log('ORAL DOJO ADMIN v3 UI-matched loaded. Data source:', DojoData.getSource(), '| catalog v'+DojoData.getCatalog().version);
</script>
