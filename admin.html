<style>
:root{ --bg:#FAF8F5; --card:#FFFFFF; --ink:#1A1A1A; --muted:#8A8A86; --teal:#14B8A6; --teal-dark:#0F766E; --yellow:#FFD93D; --orange:#FF8C42; }
*{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
h1,h2,h3,.fredoka{font-family:"Fredoka",sans-serif}
.glass-dark{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,0.92)}
.belt-shadow{box-shadow:0 12px 24px -6px rgba(0,0,0,0.12),0 4px 12px -2px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.8)}

.press:active{transform:scale(0.97)}

.wobble{animation:wobble .4s ease}
#three-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#toast{animation:toastIn .28s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.996)}to{opacity:1;transform:translateY(0) scale(1)}}

<body class="min-h-screen w-full bg-[#FAF8F5] text-[#1A1A1A] relative overflow-x-clip selection:bg-[#FFD93D]/30">
<canvas id="three-canvas"></canvas>
<div id="app" class="relative z-10"></div>
<script src="dojo-data.js"></script>
<script type="module">
await DojoData.init();
let belts=[], questions={}, research=[], dictionary=[], library=[], settings={};
function refreshData(){
  const c=DojoData.getCatalog();
  belts=c.belts||[]; questions={};
  (c.questions||[]).forEach(q=>{ (questions[q.belt]=questions[q.belt]||[]).push(q); });
  research=c.research||[]; dictionary=c.dictionary||[]; library=c.library||[]; settings=c.settings||{};
}
refreshData();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let toastTimer=null;
function showToast(msg){
  const oldT=document.getElementById('toast'); if(oldT) oldT.remove();
  const el=document.createElement('div');
  el.id='toast';
  el.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[999] bg-black text-white text-[13px] font-bold px-5 py-3 rounded-full shadow-2xl border border-[#FFD93D]/30 flex items-center gap-2';
  el.innerHTML=`<span>⚙️</span><span>${msg}</span>`;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),3200);
}
const arm=(btn,fn)=>{ if(btn.dataset.armed==='1'){ fn(); return; } btn.dataset.armed='1'; const old=btn.innerHTML; btn.innerHTML='Sure?'; setTimeout(()=>{ if(btn.isConnected){btn.innerHTML=old; btn.dataset.armed='';} },2600); };
let matchDraft=null;
function compressImageFile(file,max,quality){ max=max||240; quality=quality||0.72; return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ try{ const c=document.createElement('canvas'); const s=Math.min(1,max/Math.max(img.width,img.height)); c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',quality)); }catch(e){ rej(e); } finally{ URL.revokeObjectURL(url); } }; img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Image load failed')); }; img.src=url; }); }
function ensureMatchDraft(){
  if(matchDraft===null){ const src=(state.form&&state.form.item&&state.form.item.type==='match'&&Array.isArray(state.form.item.pairs))?state.form.item.pairs:null; matchDraft=src?JSON.parse(JSON.stringify(src)):[]; }
  while(matchDraft.length<2) matchDraft.push({left:'',leftImg:null,right:''});
}
function renderMatchEditor(){
  const host=document.getElementById('aQFMatch'); if(!host) return;
  host.innerHTML=matchDraft.map((p,i)=>`
    <div class="rounded-2xl border-2 border-black/10 bg-[#FAF8F5] p-3 flex flex-wrap items-center gap-2">
      <span class="w-6 h-6 rounded-full bg-black text-white text-[11px] font-black flex items-center justify-center shrink-0">${i+1}</span>
      <label class="w-14 h-14 rounded-xl overflow-hidden border-2 ${p.leftImg?'border-[#2ECC71]':'border-dashed border-black/25'} flex items-center justify-center cursor-pointer bg-white shrink-0 relative" title="Upload image for this tile">
        ${p.leftImg?`<img src="${p.leftImg}" class="w-full h-full object-cover">`:'<span class="text-[16px]">🖼️</span>'}
        <input type="file" accept="image/*" data-mimg="${i}" class="hidden">
        ${p.leftImg?`<button type="button" data-mimgdel="${i}" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-[#FF4B4B] text-white text-[10px] font-black flex items-center justify-center">✕</button>`:''}
      </label>
      <input data-mleft="${i}" value="${esc(p.leftImg?'':(p.left||''))}" ${p.leftImg?'disabled placeholder="image tile"':'placeholder="Word / term"'} class="flex-1 min-w-[110px] h-10 rounded-xl border-2 border-black/10 px-2.5 font-semibold text-[13px] ${p.leftImg?'bg-black/5 text-black/40':'bg-white'}">
      <span class="text-black/30 font-black">→</span>
      <input data-mright="${i}" value="${esc(p.right||'')}" placeholder="Meaning / name" class="flex-1 min-w-[110px] h-10 rounded-xl border-2 border-black/10 px-2.5 font-semibold text-[13px] bg-white">
      <button type="button" data-mdel="${i}" class="w-8 h-8 rounded-full bg-[#FFF1F1] border border-[#FF4B4B]/20 text-[#9A1A1A] flex items-center justify-center text-[12px] press" title="Remove pair">🗑</button>
    </div>`).join('')
    +`<div class="flex items-center gap-2 flex-wrap"><button type="button" id="aQAddPair" class="h-10 px-4 rounded-full bg-[#FFD93D] border border-black/10 font-black text-[12px] press">+ Add Pair (${matchDraft.length}/8)</button></div>
    <p class="text-[11px] font-medium text-black/40 mt-1">Left tile = a word OR an uploaded image (auto-compressed). Right tile = its meaning / name. Minimum 2 pairs. Images are embedded in the catalog, so keep them small.</p>`;
  host.querySelectorAll('[data-mimg]').forEach(inp=>inp.onchange=async()=>{ const i=parseInt(inp.dataset.mimg,10); const f=inp.files&&inp.files[0]; if(!f) return; try{ matchDraft[i].leftImg=await compressImageFile(f); matchDraft[i].left=''; }catch(e){ showToast('Image failed to load'); } renderMatchEditor(); });
  host.querySelectorAll('[data-mimgdel]').forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const i=parseInt(b.dataset.mimgdel,10); matchDraft[i].leftImg=null; renderMatchEditor(); });
  host.querySelectorAll('[data-mleft]').forEach(inp=>inp.oninput=()=>{ matchDraft[parseInt(inp.dataset.mleft,10)].left=inp.value; });
  host.querySelectorAll('[data-mright]').forEach(inp=>inp.oninput=()=>{ matchDraft[parseInt(inp.dataset.mright,10)].right=inp.value; });
  host.querySelectorAll('[data-mdel]').forEach(b=>b.onclick=()=>{ const i=parseInt(b.dataset.mdel,10); matchDraft.splice(i,1); while(matchDraft.length<2) matchDraft.push({left:'',leftImg:null,right:''}); renderMatchEditor(); });
  document.getElementById('aQAddPair').onclick=()=>{ if(matchDraft.length>=8){ showToast('Max 8 pairs'); return; } matchDraft.push({left:'',leftImg:null,right:''}); renderMatchEditor(); };
}
function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>showToast('Copied '+text.split('---').length+' items — OSS!')).catch(()=>fallbackCopy(text)); } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); showToast('Copied!');}catch(e){showToast('Copy failed');} ta.remove();
}
function genQBulk(list){ return list.map(q=>{ if(q.type==='match'){ const prs=(q.pairs||[]).map(p=>`Pair: ${p.leftImg?'[image]':p.left} = ${p.right}`).join('\n'); return `Belt: ${q.belt}\nTopic: ${q.topic}\nType: match\nQ: ${q.q}\n${prs}\nExplanation: ${q.explanation}`; } const opts=(q.options||[]).map((o,i)=>`${String.fromCharCode(65+i)}) ${o}`).join('\n'); return `Belt: ${q.belt}\nTopic: ${q.topic}\nType: ${q.type}\nQ: ${q.q}\n${opts}\nAnswer: ${String.fromCharCode(65+(q.answer||0))}\nExplanation: ${q.explanation}`; }).join('\n\n---\n\n'); }
function genDictBulk(list){ return list.map(d=>`Term: ${d.term}\nReading: ${d.reading||''}\nCategory: ${d.category}\nDefinition: ${d.definition}`).join('\n\n---\n\n'); }
function genLibBulk(list){ return list.map(l=>`Title: ${l.title}\nAuthor: ${l.author||''}\nType: ${l.type}\nCategory: ${l.category}\nDescription: ${l.description}\nURL: ${l.url||''}`).join('\n\n---\n\n'); }
function genResBulk(list){ return list.map(r=>`Title: ${r.title}\nAuthor: ${r.author||''}\nRank: ${r.rank||''}\nTag: ${r.tag||''}\nExcerpt: ${r.excerpt||''}\nLikes: ${r.likes||0}`).join('\n\n---\n\n'); }

const app=document.getElementById('app');

function render(){ try{ renderApp(); }catch(e){ console.error(e); DojoData.discardDraft().then(()=>{ refreshData(); try{ renderApp(); }catch(e2){ document.getElementById('app').innerHTML='<div style="padding:48px;text-align:center;font-weight:700">Data error — reload.</div>'; } }); } }

  const srcLabel=DojoData.getSource();

  if(!state.authed){

            <button type="submit" class="w-full h-[52px] rounded-full bg-black text-white font-bold fredoka text-[15px] press">Unlock →</button>

  } else {

    const tabBar=`<div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">${tabDefs.map(t=>`<button data-atab="${t[0]}" class="aTab shrink-0 h-10 px-4 rounded-full text-[12px] font-bold border press ${state.tab===t[0]?'bg-black text-white border-black':'bg-white border-black/10'}">${t[1]}</button>`).join('')}</div>`;

  }
  const headerAuthed = state.authed ? `

        <div class="flex items-center gap-3">
          <img src="assets/logo/od-logo.png" alt="Logo" class="h-6 w-auto max-w-[110px] object-contain">
          <div class="hidden sm:block"><div class="fredoka font-bold leading-none text-[13px]">ORAL DOJO — ADMIN v4</div><div class="text-[10px] font-bold tracking-[0.15em] text-black/40">BULK • COPY ALL • CATEGORY</div></div>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="hidden lg:flex text-[10px] font-black bg-[#FAF8F5] border px-3 py-1.5 rounded-full max-w-[200px] truncate">${esc(srcLabel)}</span>
          <span class="text-[10px] font-black bg-[#FFF8D6] border border-[#FFD93D]/40 px-2.5 py-1.5 rounded-full">v${esc(cat.version)}</span>
          <button id="adExport" class="h-9 px-3 rounded-full bg-black text-[#FFD93D] text-[11px] font-black press">⬇ Export</button>
          <a href="index.html" class="h-9 px-3 rounded-full bg-white border text-[11px] font-bold press">Dojo ↗</a>
          <button id="adLock" class="w-9 h-9 rounded-full bg-[#FFF1F1] border border-[#FF4B4B]/20 flex items-center justify-center press">🔒</button>
        </div>
      </div>
    </header>` : `<header class="sticky top-0 z-30 glass-dark border-b border-black/[0.06]"><div class="max-w-[1120px] mx-auto px-4 h-[64px] flex items-center justify-between"><div class="flex items-center gap-3"><img src="assets/logo/oldo-logo.png" alt="Logo" class="h-8"><div class="fredoka font-bold">ORAL DOJO</div></div><a href="index.html" class="h-9 px-4 rounded-full bg-white border text-[11px] font-bold">Open Dojo ↗</a></div></header>`;
  app.innerHTML=`<div class="min-h-screen flex flex-col">${headerAuthed}<div class="flex-1 max-w-[1120px] w-full mx-auto px-4 py-6 pb-20">${body}</div>
    ${state.authed ? `<footer class="mt-auto border-t border-black/5 bg-white/60 backdrop-blur"><div class="max-w-[1120px] mx-auto px-4 py-4 flex items-center justify-between text-[10px] font-bold tracking-widest text-black/30"><span>ORAL DOJO ADMIN • SENSEI RICHQRD</span><span>${DojoData.getQuestions().length} Q • ${research.length} R • ${dictionary.length} D • ${library.length} L</span></div></footer>` : ''}</div>`;
  if(state.authed){

  } else {
    document.getElementById('pinForm').onsubmit=e=>{ e.preventDefault(); const val=document.getElementById('pinInput').value.trim(); if(val===String(settings.adminPin||'1234')){ state.authed=true; sessionStorage.setItem('oralDojo_admin_auth','1'); render(); playPageIn(); showToast('Welcome'); } else { document.getElementById('pinForm').classList.add('wobble'); setTimeout(()=>document.getElementById('pinForm')?.classList.remove('wobble'),400); } };
  }
  if(state.authed){
    document.querySelectorAll('.aTab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.atab; state.form=null; render(); playPageIn();});
    if(state.tab==='questions') bindQ();
    else if(state.tab==='research') bindR();
    else if(state.tab==='dictionary') bindD();
    else if(state.tab==='library') bindL();
    else bindS();
  }
}

function doExport(){
  const data=DojoData.exportCatalog();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='catalog.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); showToast('catalog.json v'+data.version+' exported');
}

function parseBulk(raw){
  const chunks = raw.split(/\n\s*---\s*\n|\n---\n|---\n|\n---/).map(s=>s.trim()).filter(Boolean);
  const results=[];
  chunks.forEach((chunk, idx)=>{
    const lines = chunk.split('\n').map(l=>l.trim()).filter(Boolean);
    let belt=null, topic='', type='mcq', q='', options=[], answer=null, explanation='', optMap={}, pairRaw=[];
    lines.forEach(line=>{
      if(line.includes('|') && /belt:/i.test(line)){ line.split('|').forEach(p=>parseLine(p.trim())); return; }
      parseLine(line);
    });
    function parseLine(l){
      let m; m=l.match(/^belt\s*[:=]\s*(\d+)/i); if(m){belt=parseInt(m[1],10); return;}
      m=l.match(/^topic\s*[:=]\s*(.+)$/i); if(m){topic=m[1].trim(); return;}
      m=l.match(/^type\s*[:=]\s*(mcq|tf|fill|scenario|match)/i); if(m){type=m[1].toLowerCase(); return;}
      m=l.match(/^pair\s*[:=]\s*(.+)$/i); if(m){pairRaw.push(m[1].trim()); return;}
      m=l.match(/^(q|question)\s*[:=]\s*(.+)$/i); if(m){q=m[2].trim(); return;}
      m=l.match(/^(answer|ans|correct)\s*[:=]\s*(.+)$/i); if(m){answer=m[2].trim(); return;}
      m=l.match(/^(explanation|exp|why)\s*[:=]\s*(.+)$/i); if(m){explanation=m[2].trim(); return;}
      m=l.match(/^([A-D]|\d)\s*[\)\.\:\-]\s*(.+)$/i); if(m){ const key=m[1].toUpperCase(); const txt=m[2].trim(); if(/^[A-D]$/.test(key)) optMap[key]=txt; else { const idxNum=parseInt(key,10)-1; const letter=String.fromCharCode(65+idxNum); optMap[letter]=txt; } return; }
    }
    if(type==='match'){
      const pairs=pairRaw.map(r=>{ const parts=r.split(/\s*(?:=|\||→|->)\s*/); return {left:(parts[0]||'').trim(), leftImg:null, right:parts.slice(1).join(' = ').trim()}; });
      if(!belt && state.bulkDefaultBelt) belt=parseInt(state.bulkDefaultBelt,10); if(!belt && state.qBelt!=='all') belt=parseInt(state.qBelt,10); if(!belt) belt=belts[0]?.id||0;
      const err=[]; if(!q) err.push('Missing Q'); if(!topic) err.push('Missing Topic'); if(!explanation) err.push('Missing Explanation'); if(pairs.length<2) err.push(`Need >=2 pairs (${pairs.length})`); if(pairs.some(p=>!p.left||!p.right)) err.push('Each pair needs left = right'); if(pairs.some(p=>/^\[image\]$/i.test(p.left))) err.push('Image tiles — add via the form');
      results.push({rawIndex:idx,belt,topic,type,q,pairs,options:[],answer:0,answerRaw:'',explanation,errors:err,valid:err.length===0});
      return;
    }
    const sortedKeys=Object.keys(optMap).sort(); options=sortedKeys.map(k=>optMap[k]);
    let ansIdx=-1; if(answer!==null){ const aStr=String(answer).trim(); if(/^[A-Da-d]$/.test(aStr)) ansIdx=aStr.toUpperCase().charCodeAt(0)-65; else if(/^\d+$/.test(aStr)){ const n=parseInt(aStr,10); ansIdx=n>=0&&n<=3?n:n-1; } else { const found=options.findIndex(o=>o.toLowerCase()===aStr.toLowerCase()||o.toLowerCase().includes(aStr.toLowerCase())); if(found>=0) ansIdx=found; } }
    const err=[]; if(!q) err.push('Missing Q'); if(options.length<2) err.push(`Need >=2 opts (${options.length})`); if(ansIdx<0||ansIdx>=options.length) err.push(`Invalid Answer "${answer}"`); if(!topic) err.push('Missing Topic'); if(!explanation) err.push('Missing Explanation');
    if(!belt && state.bulkDefaultBelt) belt=parseInt(state.bulkDefaultBelt,10); if(!belt && state.qBelt!=='all') belt=parseInt(state.qBelt,10); if(!belt) belt=belts[0]?.id||0;
    results.push({rawIndex:idx,belt,topic,type,q,options,answer:ansIdx,answerRaw:answer,explanation,errors:err,valid:err.length===0});
  });
  return results;
}
function parseDictBulk(raw){
  const chunks=raw.split(/\n\s*---\s*\n|\n---\n|---\n|\n---/).map(s=>s.trim()).filter(Boolean);
  return chunks.map(chunk=>{
    const lines=chunk.split('\n').map(l=>l.trim()).filter(Boolean);
    let term='',reading='',category='Concepts',definition='';

function bindQ(){
  const wrap=document.getElementById('aQFOpts');
  document.getElementById('aQAdd').onclick=()=>{state.form={kind:'q', item:null}; state.bulkOpen=false; matchDraft=null; render();};
  document.getElementById('aQBulk').onclick=()=>{state.bulkOpen=!state.bulkOpen; state.form=null; render();};
  document.getElementById('aQBeltFilter').onchange=e=>{state.qBelt=e.target.value; state.selected.clear(); state.form=null; render();};
  document.getElementById('aQCopyAll')?.addEventListener('click',()=>{ const all=DojoData.getQuestions(); copyToClipboard(genQBulk(all)); });
  document.getElementById('aQCopyFiltered')?.addEventListener('click',()=>{ const all=DojoData.getQuestions(); const filtered=state.qBelt==='all'?all:all.filter(q=>q.belt===parseInt(state.qBelt,10)); copyToClipboard(genQBulk(filtered)); });
  document.querySelectorAll('[data-qedit]').forEach(b=>b.onclick=()=>{ const q=DojoData.getQuestions().find(x=>String(x.id)===String(b.dataset.qedit)); state.form={kind:'q', item:JSON.parse(JSON.stringify(q))}; state.bulkOpen=false; matchDraft=null; render(); });
  document.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>arm(b,async()=>{ await DojoData.deleteQuestion(b.dataset.qdel); state.form=null; refreshData(); render(); showToast('Deleted'); }));
  document.querySelectorAll('[data-qsel]').forEach(cb=>{ cb.onchange=()=>{ if(cb.checked) state.selected.add(String(cb.dataset.qsel)); else state.selected.delete(String(cb.dataset.qsel)); render(); }; });
  document.getElementById('aSelAll')?.addEventListener('click',()=>{ const allQ=DojoData.getQuestions(); const filtered=(state.qBelt==='all'?allQ:allQ.filter(q=>q.belt===parseInt(state.qBelt,10))); filtered.forEach(q=>state.selected.add(String(q.id))); render(); });
  document.getElementById('aSelClear')?.addEventListener('click',()=>{ state.selected.clear(); render(); });
  document.getElementById('aCopySelected')?.addEventListener('click',()=>{ const all=DojoData.getQuestions(); const sel=[...state.selected].map(id=>all.find(x=>String(x.id)===id)).filter(Boolean); copyToClipboard(genQBulk(sel)); });
  document.querySelectorAll('[data-qmove]').forEach(sel=>{ sel.onchange=async()=>{ const val=sel.value; if(!val) return; const [action, beltIdStr]=val.split('-'); const beltId=parseInt(beltIdStr,10); const qId=sel.dataset.qmove; const srcQ=DojoData.getQuestions().find(x=>String(x.id)===String(qId)); if(!srcQ) return; if(action==='move'){ await DojoData.upsertQuestion({...srcQ, belt:beltId}); } else { const copy={...JSON.parse(JSON.stringify(srcQ)), id:'q'+beltId+'-'+Date.now()+'-'+Math.floor(Math.random()*9999), belt:beltId}; await DojoData.upsertQuestion(copy); } refreshData(); render(); showToast(action==='move'?`Moved`:`Copied`); }; });
  const doBulkAction=async (mode)=>{ const targetBelt=parseInt(document.getElementById('aBulkTargetBelt')?.value||belts[0]?.id,10); if(state.selected.size===0){ showToast('Select first'); return; } const ids=[...state.selected]; let count=0; for(const id of ids){ const srcQ=DojoData.getQuestions().find(x=>String(x.id)===String(id)); if(!srcQ) continue; if(mode==='move'){ await DojoData.upsertQuestion({...srcQ, belt:targetBelt}); count++; } else if(mode==='copy'){ const copy={...JSON.parse(JSON.stringify(srcQ)), id:'q'+targetBelt+'-'+Date.now()+'-'+count+'-'+Math.floor(Math.random()*9999), belt:targetBelt}; await DojoData.upsertQuestion(copy); count++; } else if(mode==='delete'){ await DojoData.deleteQuestion(id); count++; } } refreshData(); if(mode!=='copy') state.selected.clear(); render(); showToast(`${count} ${mode}d`); };
  document.getElementById('aBulkMove')?.addEventListener('click',()=>doBulkAction('move')); document.getElementById('aBulkCopy')?.addEventListener('click',()=>doBulkAction('copy')); document.getElementById('aBulkDel')?.addEventListener('click',()=>arm(document.getElementById('aBulkDel'),()=>doBulkAction('delete')));
  if(state.bulkOpen){
    document.getElementById('aBulkClose')?.addEventListener('click',()=>{ state.bulkOpen=false; render(); });
    document.getElementById('aBulkCopyAllFiltered')?.addEventListener('click',()=>{ const all=DojoData.getQuestions(); const filtered=state.qBelt==='all'?all:all.filter(q=>q.belt===parseInt(state.qBelt,10)); copyToClipboard(genQBulk(filtered)); });
    document.getElementById('aBulkParse')?.addEventListener('click',()=>{ state.bulkText=document.getElementById('aBulkText').value; state.bulkDefaultBelt=document.getElementById('aBulkBelt').value; state.bulkParsed=parseBulk(state.bulkText); render(); showToast(`${state.bulkParsed.filter(x=>x.valid).length}/${state.bulkParsed.length} valid`); });
    document.getElementById('aBulkImport')?.addEventListener('click',async()=>{ if(state.bulkParsed.length===0){ state.bulkText=document.getElementById('aBulkText').value; state.bulkParsed=parseBulk(state.bulkText); } const valids=state.bulkParsed.filter(x=>x.valid); if(valids.length===0){ showToast('No valid'); return; } let imported=0; for(const p of valids){ const item={ id:'q'+p.belt+'-'+Date.now()+'-'+imported+'-'+Math.floor(Math.random()*9999), belt:p.belt, type:p.type, topic:p.topic, q:p.q, ...(p.type==='match'?{pairs:(p.pairs||[]).map(pp=>({left:pp.left,leftImg:null,right:pp.right})),options:[],answer:0}:{options:p.options,answer:p.answer}), explanation:p.explanation }; await DojoData.upsertQuestion(item); imported++; } refreshData(); showToast(`${imported} imported`); state.bulkOpen=false; state.bulkParsed=[]; render(); });
  }
  if(!wrap) return;
  const typeSel=document.getElementById('aQFType'); const ansSel=document.getElementById('aQFAns');
  const build=(preserve)=>{
    if(typeSel.value==='match'){
      document.getElementById('aQOptsBlock').style.display='none';
      document.getElementById('aQAnsBlock').style.display='none';
      document.getElementById('aQMatchBlock').style.display='';
      ensureMatchDraft();
      renderMatchEditor();
      return;
    }
    document.getElementById('aQOptsBlock').style.display='';
    document.getElementById('aQAnsBlock').style.display='';
    document.getElementById('aQMatchBlock').style.display='none';
    const n=typeSel.value==='tf'?2:4; const prev=preserve?[...wrap.querySelectorAll('input')].map(i=>i.value):[]; const base=(state.form&&state.form.item&&state.form.item.options)||[]; wrap.innerHTML=[...Array(n)].map((_,i)=>{ const val=prev[i]!==undefined?prev[i]:(base[i]||''); return `<input data-oi="${i}" placeholder="Option ${String.fromCharCode(65+i)}" value="${esc(val)}" class="w-full h-11 rounded-2xl border-2 border-black/10 px-3 font-semibold text-[14px]">`; }).join(''); ansSel.innerHTML=[...Array(n)].map((_,i)=>`<option value="${i}">${String.fromCharCode(65+i)}</option>`).join(''); const a=(state.form&&state.form.item)?state.form.item.answer:0; ansSel.value=String(Math.min(a,n-1));
  };
  build(false); typeSel.onchange=()=>build(true);
  document.getElementById('aQCancel').onclick=()=>{state.form=null; matchDraft=null; render();};
  document.getElementById('aQSave').onclick=async()=>{
    const idVal=document.getElementById('aQFId').value||('q'+document.getElementById('aQFBelt').value+'-'+Date.now());
    const beltVal=parseInt(document.getElementById('aQFBelt').value,10);
    const topicVal=document.getElementById('aQFTopic').value.trim();
    const qVal=document.getElementById('aQFQ').value.trim();
    const exVal=document.getElementById('aQFEx').value.trim();
    if(typeSel.value==='match'){
      if(!topicVal||!qVal||!exVal){ showToast('Fill topic, prompt and explanation'); return; }
      const pairs=(matchDraft||[]).map(p=>({left:(p.left||'').trim(), leftImg:p.leftImg||null, right:(p.right||'').trim()}));
      if(pairs.length<2||pairs.some(p=>(!p.leftImg&&!p.left)||!p.right)){ showToast('Each pair needs a word/image and a match — min 2 pairs'); return; }
      await DojoData.upsertQuestion({ id:idVal, belt:beltVal, type:'match', topic:topicVal, q:qVal, pairs, options:[], answer:0, explanation:exVal });
      state.form=null; matchDraft=null; refreshData(); render(); showToast('Match question saved — OSS!'); return;
    }
    const opts=[...wrap.querySelectorAll('input')].map(i=>i.value.trim());
    const item={ id:idVal, belt:beltVal, type:typeSel.value, topic:topicVal, q:qVal, options:opts, answer:parseInt(ansSel.value,10), explanation:exVal };
    if(!item.topic||!item.q||!item.explanation||opts.some(o=>!o)){ showToast('Fill all'); return; }
    await DojoData.upsertQuestion(item); state.form=null; refreshData(); render(); showToast('Saved');
  };
}
